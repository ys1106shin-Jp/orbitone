          const dt = d.decayTime > 0 ? d.decayTime : Math.max(0.01, dur - rel - attack);
          const decayEnd = Math.max(time + attack + 0.002, Math.min(time + attack + dt, time + dur - rel));
          const relStart = Math.max(time + dur - rel, decayEnd);
          param.exponentialRampToValueAtTime(sus, decayEnd);
          param.setValueAtTime(sus, relStart);
          param.exponentialRampToValueAtTime(0.001, Math.max(time + dur, relStart + 0.01));
        }

        stopAllVoices() {
          for (const vState of this.trackActiveVoices) {
            for (const v of vState.nodes) {
              try { v.src.stop(); } catch (_) {}
            }
            vState.nodes = [];
          }
        }
      }

      const sound = new ModularSoundEngine();

      // =========================================================================
      // 2b. COMMON SYNTH ENGINE
      // ModularSoundEngine とは独立。masterGain には接続しない。
      // 起動時には発音しない。AudioContext は外から受け取る。
      // =========================================================================
      const COMMON_SYNTH_BELL_ID = 'fm-bell-test';
      const COMMON_SYNTH_MAX_VOICES = 8;

      function commonSynthClampFreq(freq) {
        if (typeof freq !== 'number' || !Number.isFinite(freq) || freq <= 0) return 440;
        if (freq < 1) return 1;
        if (freq > 12000) return 12000;
        return freq;
      }

      function commonSynthClampFilterFreq(ctx, freq) {
        const nyquist = ((ctx && ctx.sampleRate) || 44100) * 0.45;
        let f = freq;
        if (typeof f !== 'number' || !Number.isFinite(f) || f <= 0) f = 2000;
        if (f < 20) f = 20;
        if (f > nyquist) f = nyquist;
        return f;
      }

      function commonSynthNoteFrequency(params, noteVal) {
        if (typeof params.fixedFreq === 'number' && Number.isFinite(params.fixedFreq)) {
          return commonSynthClampFreq(params.fixedFreq);
        }
        let semi = (params.scale && params.scale.length) ? params.scale[0] : 0;
        if (typeof noteVal === 'number' && Number.isFinite(noteVal)) semi = noteVal;
        const oct = (typeof params.octaveOffset === 'number' && Number.isFinite(params.octaveOffset)) ? params.octaveOffset : 0;
        return commonSynthClampFreq(440 * Math.pow(2, (semi + oct - 9) / 12));
      }

      function commonSynthSchedulePitch(param, time, duration, params, settled, glideFrom) {
        const target = commonSynthClampFreq(settled);
        const start = commonSynthClampFreq(target * Math.pow(2, params.pitchStart / 12));
        const end = commonSynthClampFreq(target * Math.pow(2, params.pitchEnd / 12));
        const gate = Math.max(0.02, duration);
        const t0 = time;
        let locked = t0;
        if (params.glide > 0 && glideFrom > 1) {
          const from = commonSynthClampFreq(glideFrom);
          param.setValueAtTime(from, t0);
          const gEnd = t0 + Math.max(0.001, params.glide);
          if (Math.abs(from - target) > 0.5) param.exponentialRampToValueAtTime(target, gEnd);
          locked = gEnd;
        } else {
          param.setValueAtTime(start, t0);
          const sEnd = t0 + Math.max(0.001, params.pitchStartTime);
          if (Math.abs(start - target) > 0.5) {
            param.exponentialRampToValueAtTime(target, sEnd);
            locked = sEnd;
          }
        }
        if (Math.abs(end - target) > 0.5) {
          const bendEnd = t0 + gate;
          const bendStart = Math.max(locked + 0.002, bendEnd - Math.max(0.001, params.pitchEndTime));
          if (bendEnd > bendStart) {
            param.setValueAtTime(target, bendStart);
            param.exponentialRampToValueAtTime(end, bendEnd);
          }
        }
      }

      function commonSynthScheduleAmp(param, time, duration, attack, decay, sustain, release) {
        const gate = Math.max(0.02, duration);
        const atk = Math.min(Math.max(0.001, attack), Math.max(0.001, gate - 0.002));
        const rel = Math.max(0.005, release);
        const susLevel = Math.max(0.0001, Math.min(1, sustain));
        const t0 = time;
        const t1 = t0 + atk;
        let t2 = t1 + Math.max(0, decay);
        const tGate = t0 + gate;
        if (t2 > tGate) t2 = tGate;
        param.setValueAtTime(0, t0);
        param.linearRampToValueAtTime(1, t1);
        let hold = 1;
        if (t2 > t1 + 0.001 && susLevel < 0.999) {
          param.exponentialRampToValueAtTime(susLevel, t2);
          hold = susLevel;
        }
        const tRel = Math.max(t2 + 0.001, tGate);
        param.setValueAtTime(hold, tRel);
        param.linearRampToValueAtTime(0, tRel + rel);
        return tRel + rel;
      }

      function commonSynthScheduleFm(param, time, duration, attack, decay, sustain, release, peak) {
        const peakValue = (typeof peak === 'number' && Number.isFinite(peak)) ? Math.max(0, peak) : 0;
        const gate = Math.max(0.02, duration);
        const atk = Math.min(Math.max(0.001, attack), Math.max(0.001, gate - 0.002));
        const rel = Math.max(0.005, release);
        const sus = Math.max(0, Math.min(1, sustain)) * peakValue;
        const t0 = time;
        const t1 = t0 + atk;
        let t2 = t1 + Math.max(0, decay);
        const tGate = t0 + gate;
        if (t2 > tGate) t2 = tGate;
        param.setValueAtTime(0, t0);
        if (!(peakValue > 0)) return tGate;
        param.linearRampToValueAtTime(peakValue, t1);
        let hold = peakValue;
        if (t2 > t1 + 0.001) {
          param.linearRampToValueAtTime(sus, t2);
          hold = sus;
        }
        const tRel = Math.max(t2 + 0.001, tGate);
        param.setValueAtTime(hold, tRel);
        param.linearRampToValueAtTime(0, tRel + rel);
        return tRel + rel;
      }

      function commonSynthDriveCurve(amount) {
        const k = Math.max(0, Math.min(0.9, amount)) * 40;
        const n = 256;
        const curve = new Float32Array(n);
        for (let i = 0; i < n; i++) {
          const x = (i / (n - 1)) * 2 - 1;
          curve[i] = ((1 + k) * x) / (1 + k * Math.abs(x));
        }
        return curve;
      }

      class CommonSynthEngine {
        constructor(audioContext) {
          this.ctx = null;
          this.output = null;
          this.compressor = null;
          this.voices = Object.create(null);
          this.nextId = 1;
          this.disposed = false;
          this.prevFreq = 0;
          if (audioContext) this._adopt(audioContext);
        }

        _adopt(audioContext) {
          if (this.disposed) return false;
          if (!audioContext || typeof audioContext.createGain !== 'function') return false;
          if (audioContext.state === 'closed') return false;
          if (this.ctx && this.ctx !== audioContext) return false;
          this.ctx = audioContext;
          if (this.output) return true;
          try {
            this.output = audioContext.createGain();
            this.output.gain.value = 1;
            this.compressor = audioContext.createDynamicsCompressor();
            this.compressor.threshold.value = -3;
            this.compressor.knee.value = 0;
            this.compressor.ratio.value = 12;
            this.compressor.attack.value = 0.002;
            this.compressor.release.value = 0.05;
            this.output.connect(this.compressor);
            this.compressor.connect(audioContext.destination);
            return true;
          } catch (err) {
            try { if (this.output) this.output.disconnect(); } catch (ignore) {}
            try { if (this.compressor) this.compressor.disconnect(); } catch (ignore) {}
            this.output = null;
            this.compressor = null;
            this.ctx = null;
            return false;
          }
        }

        play(params, noteVal, duration) {
          let id = 0;
          try {
            if (this.disposed || !this.ctx || this.ctx.state === 'closed' || !this.output) return null;
            if (Object.keys(this.voices).length >= COMMON_SYNTH_MAX_VOICES) return null;
            const safe = createCommonSynthParams(params);
            let gate = 1.5;
            if (typeof duration === 'number' && Number.isFinite(duration) && duration > 0) {
              gate = Math.min(12, Math.max(0.02, duration));
            }
            const ctx = this.ctx;
            const time = ctx.currentTime + 0.005;
            const noteFreq = commonSynthNoteFrequency(safe, noteVal);
            const osc1Base = commonSynthClampFreq(noteFreq * Math.pow(2, safe.osc1Octave));
            const useFm = safe.mode !== 'sampler' && safe.fmEnabled && safe.fmLevel > 0 && safe.fmIndex > 0 && safe.osc1Level > 0;
            const modBase = useFm ? commonSynthClampFreq(osc1Base * safe.fmRatio) : 0;
            const nodes = [];
            const sources = [];
            const mix = ctx.createGain();
            mix.gain.value = 1;
            nodes.push(mix);
            let osc1 = null;
            if (safe.osc1Level > 0) {
              osc1 = ctx.createOscillator();
              try { osc1.type = safe.osc1Wave; } catch (err) { osc1.type = 'sine'; }
              const glide1 = this.prevFreq > 0 ? commonSynthClampFreq(this.prevFreq * Math.pow(2, safe.osc1Octave)) : 0;
              commonSynthSchedulePitch(osc1.frequency, time, gate, safe, osc1Base, glide1);
              const osc1Gain = ctx.createGain();
              osc1Gain.gain.value = safe.osc1Level;
              osc1.connect(osc1Gain);
              osc1Gain.connect(mix);
              nodes.push(osc1, osc1Gain);
              sources.push(osc1);
            }
            if (safe.osc2Level > 0) {
              const osc2 = ctx.createOscillator();
              try { osc2.type = safe.osc2Wave; } catch (err) { osc2.type = 'sine'; }
              const osc2Base = commonSynthClampFreq(noteFreq * Math.pow(2, safe.osc2Octave));
              const glide2 = this.prevFreq > 0 ? commonSynthClampFreq(this.prevFreq * Math.pow(2, safe.osc2Octave)) : 0;
              commonSynthSchedulePitch(osc2.frequency, time, gate, safe, osc2Base, glide2);
              osc2.detune.setValueAtTime(safe.osc2Detune, time);
              const osc2Gain = ctx.createGain();
              osc2Gain.gain.value = safe.osc2Level;
              osc2.connect(osc2Gain);
              osc2Gain.connect(mix);
              nodes.push(osc2, osc2Gain);
              sources.push(osc2);
            }
            if (safe.noiseLevel > 0) {
              const seconds = Math.min(12, gate + safe.release + 0.1);
              const length = Math.max(1, Math.floor((ctx.sampleRate || 44100) * seconds));
              const buffer = ctx.createBuffer(1, length, ctx.sampleRate || 44100);
              const data = buffer.getChannelData(0);
              for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
              const noise = ctx.createBufferSource();
              noise.buffer = buffer;
              const noiseGain = ctx.createGain();
              noiseGain.gain.value = safe.noiseLevel;
              noise.connect(noiseGain);
              noiseGain.connect(mix);
              nodes.push(noise, noiseGain);
              sources.push(noise);
            }
            let fmGain = null;
            if (useFm && osc1) {
              const mod = ctx.createOscillator();
              try { mod.type = safe.fmWave; } catch (err) { mod.type = 'sine'; }
              const glideMod = this.prevFreq > 0 ? commonSynthClampFreq(this.prevFreq * Math.pow(2, safe.osc1Octave) * safe.fmRatio) : 0;
              commonSynthSchedulePitch(mod.frequency, time, gate, safe, modBase, glideMod);
              fmGain = ctx.createGain();
              fmGain.gain.value = 0;
              const depth = safe.fmIndex * modBase * safe.fmLevel;
              commonSynthScheduleFm(fmGain.gain, time, gate, safe.fmAttack, safe.fmDecay, safe.fmSustain, safe.fmRelease, depth);
              mod.connect(fmGain);
              fmGain.connect(osc1.frequency);
              nodes.push(mod, fmGain);
              sources.push(mod);
            }
            if (!sources.length) {
              try { mix.disconnect(); } catch (err) {}
              return null;
            }
            let tail = mix;
            if (safe.filterType !== 'none') {
              const filter = ctx.createBiquadFilter();
              filter.type = safe.filterType;
              const cutoff = commonSynthClampFilterFreq(ctx, safe.cutoff);
              filter.frequency.setValueAtTime(cutoff, time);
              filter.Q.setValueAtTime(Math.max(0.0001, safe.q), time);
              if (safe.filterEnv) {
                const dropped = commonSynthClampFilterFreq(ctx, cutoff * safe.filterEnvDrop);
                if (Math.abs(dropped - cutoff) > 1) {
                  filter.frequency.exponentialRampToValueAtTime(dropped, time + gate);
                }
              }
              tail.connect(filter);
              tail = filter;
              nodes.push(filter);
            }
            if (safe.drive > 0) {
              const shaper = ctx.createWaveShaper();
              shaper.curve = commonSynthDriveCurve(safe.drive);
              shaper.oversample = 'none';
              tail.connect(shaper);
              tail = shaper;
              nodes.push(shaper);
            }
            const amp = ctx.createGain();
            const envEnd = commonSynthScheduleAmp(amp.gain, time, gate, safe.attack, safe.decayTime, safe.sustain, safe.release);
            const level = ctx.createGain();
            level.gain.value = Math.max(0, Math.min(0.8, safe.outputGain));
            tail.connect(amp);
            amp.connect(level);
            level.connect(this.output);
            nodes.push(amp, level);
            const stopAt = Math.max(envEnd, time + gate) + 0.03;
            id = this.nextId++;
            const voice = {
              id: id,
              nodes: nodes,
              sources: sources,
              amp: amp,
              fmGain: fmGain,
              released: false,
              stopping: false,
              timer: 0
            };
            this.voices[id] = voice;
            this.prevFreq = noteFreq;
            const engine = this;
            const release = function () { engine._releaseVoice(id); };
            for (let i = 0; i < sources.length; i++) {
              sources[i].onended = release;
              sources[i].start(time);
              sources[i].stop(stopAt);
            }
            voice.timer = setTimeout(release, Math.max(100, (stopAt - ctx.currentTime) * 1000 + 80));
            return { id: id, stop: function () { engine._stopVoice(id); } };
          } catch (err) {
            if (id) this._releaseVoice(id);
            return null;
          }
        }

        _stopVoice(id) {
          const voice = this.voices[id];
          if (!voice || voice.stopping || voice.released) return;
          voice.stopping = true;
          const ctx = this.ctx;
          const engine = this;
          if (!ctx || ctx.state === 'closed') {
            this._releaseVoice(id);
            return;
          }
          const t = ctx.currentTime + 0.001;
          const end = t + 0.03;
          if (voice.amp) {
            try {
              voice.amp.gain.cancelScheduledValues(t);
              voice.amp.gain.setValueAtTime(Math.max(0.0001, voice.amp.gain.value), t);
              voice.amp.gain.exponentialRampToValueAtTime(0.0001, end);
            } catch (err) {}
          }
          if (voice.fmGain) {
            try {
              voice.fmGain.gain.cancelScheduledValues(t);
              voice.fmGain.gain.setValueAtTime(Math.max(0, voice.fmGain.gain.value), t);
              voice.fmGain.gain.linearRampToValueAtTime(0, end);
            } catch (err) {}
          }
          const sources = voice.sources || [];
          for (let i = 0; i < sources.length; i++) {
            try { sources[i].stop(end + 0.02); } catch (err) {}
          }
          if (voice.timer) clearTimeout(voice.timer);
          voice.timer = setTimeout(function () { engine._releaseVoice(id); }, 90);
        }

        _releaseVoice(id) {
          const voice = this.voices[id];
          if (!voice || voice.released) return;
          voice.released = true;
          if (voice.timer) {
            clearTimeout(voice.timer);
            voice.timer = 0;
          }
          const sources = voice.sources || [];
          for (let i = 0; i < sources.length; i++) {
            try { sources[i].onended = null; } catch (err) {}
            try { sources[i].stop(); } catch (err) {}
          }
          const nodes = voice.nodes || [];
          for (let i = 0; i < nodes.length; i++) {
            try { nodes[i].disconnect(); } catch (err) {}
          }
          voice.nodes = [];
          voice.sources = [];
          delete this.voices[id];
        }

        stopAll() {
          if (!this.voices) return;
          const ids = Object.keys(this.voices);
          for (let i = 0; i < ids.length; i++) this._stopVoice(ids[i]);
        }

        dispose() {
          if (this.disposed) return;
          this.disposed = true;
          try { this.stopAll(); } catch (err) {}
          const ids = this.voices ? Object.keys(this.voices) : [];
          for (let i = 0; i < ids.length; i++) this._releaseVoice(ids[i]);
          try { if (this.output) this.output.disconnect(); } catch (err) {}
          try { if (this.compressor) this.compressor.disconnect(); } catch (err) {}
          this.output = null;
          this.compressor = null;
          this.ctx = null;
          this.voices = Object.create(null);
        }
      }

      // =========================================================================
      // 3. SCHEDULER & RECORDING
      // =========================================================================
      function applyQueuedClips() {
        let changed = false;
        for (let t = 0; t < 5; t++) {
          const queuedPlayIdx = sessionClips[t].findIndex(c => c.queued);
          const queuedStopIdx = sessionClips[t].findIndex(c => c.queuedStop);

          if (queuedPlayIdx !== -1) {
            for (let r = 0; r < 4; r++) {
              sessionClips[t][r].active = false;
              sessionClips[t][r].queued = false;
              sessionClips[t][r].queuedStop = false;
            }
            sessionClips[t][queuedPlayIdx].active = true;
            changed = true;
          } else if (queuedStopIdx !== -1) {
            sessionClips[t][queuedStopIdx].active = false;
            sessionClips[t][queuedStopIdx].queuedStop = false;
            changed = true;
          }
        }
        if (changed) updateSessionPadVisuals();
      }

      // ★ トラックごとの回転速度（speed: 0.25 → 4小節で1周）
      function getTrackDiv(t) {
        const s = activeGenre.tracks[t].speed;
        return (s && s > 0 && s < 1) ? Math.round(1 / s) : 1;
      }

      function scheduleStep(step, time) {
        if (step === 0) {
          lastScheduledBarStart = time;
          barCounter++;
          applyQueuedClips();

          if (recState === 'armed') startMediaRecording(time);
          else if (recState === 'recording') stopMediaRecording();
        }

        const absStep = Math.max(0, barCounter) * STEPS_PER_BAR + step;

        for (let t = 0; t < 5; t++) {
          const activeClip = sessionClips[t].find(c => c.active);
          if (!activeClip) continue;

          const div = getTrackDiv(t);
          if (absStep % div !== 0) continue;
          const trackStep = Math.floor(absStep / div) % STEPS_PER_BAR;

          const hits = activeClip.tokens.filter(tok => tok.step === trackStep);
          for (const tok of hits) {
            sound.triggerTrack(t, time, tok.radius, activeClip);
          }
        }
      }

      function schedulerLoop() {
        if (!isPlaying || !sound.ctx) return;
        const stepDur = (60 / bpm) / 4;
        const lookahead = 0.1;

        while (nextNoteTime < sound.ctx.currentTime + lookahead) {
          scheduleStep(currentStep, nextNoteTime);
          nextNoteTime += stepDur;
          currentStep = (currentStep + 1) % STEPS_PER_BAR;
        }
      }

      function startPlayback() {
        sound.ensureContext();
        if (isPlaying) return;
        isPlaying = true;
        currentStep = 0;
        barCounter = -1;
        const now = sound.ctx ? sound.ctx.currentTime + 0.03 : 0;
        nextNoteTime = now;
        lastScheduledBarStart = now;

        for (let t = 0; t < 5; t++) {
          if (!sessionClips[t].some(c => c.active)) {
            sessionClips[t][selectedRow].active = true;
          }
        }
        updateSessionPadVisuals();
        updateTransportUI();

        schedulerTimer = setInterval(schedulerLoop, 25);
      }

      function stopPlayback() {
        isPlaying = false;
        if (schedulerTimer) {
          clearInterval(schedulerTimer);
          schedulerTimer = null;
        }
        sound.stopAllVoices();
        for (let t = 0; t < 5; t++) {
          trackSpinPhase[t] = 0;
          for (let r = 0; r < 4; r++) {
            sessionClips[t][r].queued = false;
            sessionClips[t][r].queuedStop = false;
          }
        }
        if (recState !== 'off') {
          recState = 'off';
          if (mediaRecorder && mediaRecorder.state === 'recording') {
            try { mediaRecorder.stop(); } catch(_) {}
          }
        }
        updateSessionPadVisuals();
        updateTransportUI();
      }

      async function prepareMicAndArm() {
        sound.ensureContext();
        selectedTrack = 4;
        updateTrackHeaders();
        renderKnobPanel();

        try {
          if (!mediaStream) {
            mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          }
          recState = 'armed';
          updateTransportUI();
          if (!isPlaying) startPlayback();
        } catch (err) {
          alert('マイクの使用が許可されていません: ' + err.message);
          recState = 'off';
          updateTransportUI();
        }
      }

      function startMediaRecording(time) {
        if (!mediaStream) return;
        recChunks = [];
        const options = MediaRecorder.isTypeSupported('audio/webm') ? { mimeType: 'audio/webm' } : undefined;
        try {
          mediaRecorder = options ? new MediaRecorder(mediaStream, options) : new MediaRecorder(mediaStream);
        } catch (_) {
          mediaRecorder = new MediaRecorder(mediaStream);
        }

        mediaRecorder.ondataavailable = (ev) => {
          if (ev.data && ev.data.size > 0) recChunks.push(ev.data);
        };

        mediaRecorder.onstop = async () => {
          try {
            const blob = new Blob(recChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
            const arrBuf = await blob.arrayBuffer();
            const decoded = await sound.ctx.decodeAudioData(arrBuf);
            const clip = sessionClips[4][selectedRow];
            clip.audioBuffer = decoded;
            clip.active = true;
            if (clip.tokens.length === 0) clip.tokens.push({ step: 0, radius: 0.5 });
            updateSessionPadVisuals();
          } catch (e) {
            console.error('録音デコードエラー:', e);
          }
          recState = 'off';
          updateTransportUI();
        };

        recStartBarTime = time;
        recDurationSec = (60 / bpm) * 4;
        recState = 'recording';
        updateTransportUI();
        mediaRecorder.start();
      }

      function stopMediaRecording() {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
          try { mediaRecorder.stop(); } catch (_) {}
        }
      }

       async function loadDefaultSamples(key) {
        const list = DEFAULT_SAMPLES[key];
        if (!list) return;
        sound.ensureContext();
        for (const item of list) {
          try {
            const res = await fetch(item.url);
            if (!res.ok) throw new Error(item.url + ' が見つかりません');
            const arrBuf = await res.arrayBuffer();
            const decoded = await sound.ctx.decodeAudioData(arrBuf);
            const clip = sessionClips[item.track][item.row];
            clip.audioBuffer = decoded;
            if (clip.tokens.length === 0) clip.tokens.push({ step: 0, radius: 0.5 });
            updateSessionPadVisuals();
          } catch (e) {
            console.error('初期サンプル読み込みエラー:', e);
          }
        }
      }

                  sessionClips[t][rr].queued = false;
                  sessionClips[t][rr].queuedStop = false;
                }
                clip.active = !wasActive;
              } else {
                if (clip.active) {
                  clip.queuedStop = !clip.queuedStop;
                  clip.queued = false;
                } else {
                  for (let rr = 0; rr < 4; rr++) {
                    sessionClips[t][rr].queued = false;
                    sessionClips[t][rr].queuedStop = false;
                  }
                  clip.queued = true;

      function updateSessionPadVisuals() {

      const knobPanelEl = document.getElementById('knob-panel');

      function createKnobElement(label, getVal, setVal) {
        const unit = document.createElement('div');
        unit.className = 'knob-unit';

        const knob = document.createElement('div');
        knob.className = 'rotary-knob';

        const svgNS = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(svgNS, 'svg');
        svg.setAttribute('viewBox', '0 0 60 60');
        svg.classList.add('knob-ring-svg');

        const bgArc = document.createElementNS(svgNS, 'circle');
        bgArc.setAttribute('cx', '30'); bgArc.setAttribute('cy', '30'); bgArc.setAttribute('r', '26');
        bgArc.setAttribute('fill', 'none'); bgArc.setAttribute('stroke', '#222222'); bgArc.setAttribute('stroke-width', '3.5');

        const valArc = document.createElementNS(svgNS, 'circle');
        valArc.setAttribute('cx', '30'); valArc.setAttribute('cy', '30'); valArc.setAttribute('r', '26');
        valArc.setAttribute('fill', 'none'); valArc.setAttribute('stroke', activeGenre.theme.accent);
        valArc.setAttribute('stroke-width', '3.5'); valArc.setAttribute('stroke-linecap', 'round');
        const circ = 2 * Math.PI * 26;
        valArc.setAttribute('stroke-dasharray', `${circ}`);
        valArc.setAttribute('transform', 'rotate(135 30 30)');

        svg.appendChild(bgArc);
        svg.appendChild(valArc);

        const pointer = document.createElement('div');
        pointer.className = 'knob-pointer';

        knob.appendChild(svg);
        knob.appendChild(pointer);

        const lbl = document.createElement('div');
        lbl.className = 'knob-label';
        lbl.textContent = label;

        unit.appendChild(knob);
        unit.appendChild(lbl);

        function syncVisual() {
          const v = getVal();
          const deg = -135 + v * 270;
          pointer.style.transform = `rotate(${deg}deg)`;
          const arcLen = circ * 0.75 * v;
          valArc.setAttribute('stroke-dashoffset', `${circ - arcLen}`);
        }
        syncVisual();

        let dragging = false;
        let startY = 0;
        let startVal = 0;

        const onStart = (clientY) => {
          sound.ensureContext();
          dragging = true; startY = clientY; startVal = getVal();
        };

        const onMove = (clientY) => {
          if (!dragging) return;
          const dy = startY - clientY;
          const next = Math.max(0, Math.min(1, startVal + dy / 110));
          setVal(next);
          syncVisual();
        };

        const onEnd = () => { dragging = false; };

        knob.addEventListener('mousedown', (e) => { e.preventDefault(); onStart(e.clientY); });
        window.addEventListener('mousemove', (e) => onMove(e.clientY));
        window.addEventListener('mouseup', onEnd);

        knob.addEventListener('touchstart', (e) => {
          if (e.touches.length > 0) { e.preventDefault(); onStart(e.touches[0].clientY); }
        }, { passive: false });
        window.addEventListener('touchmove', (e) => {
          if (dragging && e.touches.length > 0) onMove(e.touches[0].clientY);
        }, { passive: false });
        window.addEventListener('touchend', onEnd);

        return unit;
      }

        const modeBadge = document.createElement('div');

      const btnPlay = document.getElementById('btn-play');

        if (recState !== 'off') {
          recState = 'off';
          if (mediaRecorder && mediaRecorder.state === 'recording') {
            try { mediaRecorder.stop(); } catch(_) {}
          }
          updateTransportUI();
          return;
        }
        prepareMicAndArm();
      });

      function syncBpmUI() {
        bpmDisplay.textContent = bpm;
        const norm = (bpm - MIN_BPM) / (MAX_BPM - MIN_BPM);
        const deg = -135 + norm * 270;
        bpmPointer.style.transform = `rotate(${deg}deg)`;
      }

      let bpmDragging = false;
      let bpmStartY = 0;
      let bpmStartVal = bpm;

      bpmKnob.addEventListener('mousedown', (e) => {
        e.preventDefault();
        bpmDragging = true; bpmStartY = e.clientY; bpmStartVal = bpm;
      });
      window.addEventListener('mousemove', (e) => {
        if (!bpmDragging) return;
        const dy = bpmStartY - e.clientY;
        bpm = Math.round(Math.max(MIN_BPM, Math.min(MAX_BPM, bpmStartVal + dy * 0.6)));
        syncBpmUI();
      });
      window.addEventListener('mouseup', () => { bpmDragging = false; });

      bpmKnob.addEventListener('touchstart', (e) => {
        if (e.touches.length > 0) { e.preventDefault(); bpmDragging = true; bpmStartY = e.touches[0].clientY; bpmStartVal = bpm; }
      }, { passive: false });
      window.addEventListener('touchmove', (e) => {
        if (bpmDragging && e.touches.length > 0) {
          const dy = bpmStartY - e.touches[0].clientY;
          bpm = Math.round(Math.max(MIN_BPM, Math.min(MAX_BPM, bpmStartVal + dy * 0.6)));
          syncBpmUI();
        }
      }, { passive: false });
      window.addEventListener('touchend', () => { bpmDragging = false; });

      // =========================================================================
      // 6. CANVAS SEQUENCER
      // =========================================================================
      const bgCanvas = document.getElementById('bg-splash-canvas');
      const bgCtx = bgCanvas.getContext('2d');
      const mainDisc = document.getElementById('main-disc-canvas');
      const mainCtx = mainDisc.getContext('2d');

      let discGeo = { cx: 100, cy: 100, r: 95, innerR: 18, outerR: 86 };

      function paintBackgroundChassis() {
        const w = bgCanvas.parentElement.clientWidth || window.innerWidth;
        const h = bgCanvas.parentElement.clientHeight || window.innerHeight;
        bgCanvas.width = w; bgCanvas.height = h;
        bgCtx.fillStyle = activeGenre.theme.bg;
        bgCtx.fillRect(0, 0, w, h);
      }

      function resizeAllCanvases() {
        paintBackgroundChassis();
        const discPanel = document.getElementById('disc-panel');
        const pw = discPanel.clientWidth - 4;
        const ph = discPanel.clientHeight - 4;
        const size = Math.max(130, Math.floor(Math.min(pw, ph)));

        mainDisc.width = size; mainDisc.height = size;
        mainDisc.style.width = `${size}px`; mainDisc.style.height = `${size}px`;

        const cx = size / 2; const cy = size / 2; const r = size / 2 - 3;
        discGeo = { cx, cy, r, innerR: r * 0.19, outerR: r * 0.91 };

        for (const item of miniDiscItems) {
          const rect = item.pad.getBoundingClientRect();
          const mSize = Math.max(20, Math.floor(Math.min(rect.width, rect.height) - 4));
          item.canvas.width = mSize; item.canvas.height = mSize;
          item.canvas.style.width = `${mSize}px`; item.canvas.style.height = `${mSize}px`;
        }
      }

      function getTokenScreenPos(tok, phase) {
        const { cx, cy, innerR, outerR } = discGeo;
        const radDist = innerR + tok.radius * (outerR - innerR);
        const relAngle = (tok.step / STEPS_PER_BAR) * Math.PI * 2;
        const canvasAngle = -Math.PI / 2 + relAngle;
        return { x: cx + Math.cos(canvasAngle) * radDist, y: cy + Math.sin(canvasAngle) * radDist };
      }

      function coordsToDiscPolar(x, y) {
        const { cx, cy, innerR, outerR } = discGeo;
        const dx = x - cx; const dy = y - cy;
        const dist = Math.hypot(dx, dy);
        if (dist < innerR * 0.7 || dist > outerR * 1.12) return null;

        const normRadius = Math.max(0.05, Math.min(0.98, (dist - innerR) / (outerR - innerR)));
        const canvasAngle = Math.atan2(dy, dx);
        let relAngle = canvasAngle - (-Math.PI / 2);
        let normStep = (relAngle / (Math.PI * 2)) % 1;
        if (normStep < 0) normStep += 1;
        const step = Math.round(normStep * STEPS_PER_BAR) % STEPS_PER_BAR;
        return { step, radius: normRadius };
      }

      // =========================================================================
      // ★ 音階にカクカク止まる（スナップ）＋ 音程を変えたら音が鳴る
      //   対象：音階が2音以上あるトラック（WEIRD以外）。キックやハイハットは今まで通り滑らか。
      //   トラック定義に snap: false と書くと、そのトラックだけスナップを切れます。
      // =========================================================================
      function isSnapTrack(def) {
        if (def.snap !== undefined) return def.snap;
        return def.scale.length > 1 && def.synthType !== 'weird';
      }
      function radiusToIndex(r, len) {
        return Math.min(len - 1, Math.max(0, Math.floor((1 - r) * len)));
      }
      function snapRadius(r, len) {
        return 1 - (radiusToIndex(r, len) + 0.5) / len;
      }
      let lastPreviewAt = 0;
      function previewNote(radius, clip) {
        if (!sound.ctx) return;
        const nowMs = performance.now();
        if (nowMs - lastPreviewAt < 60) return;   // 速く動かした時に鳴りすぎない
        lastPreviewAt = nowMs;
        sound.triggerTrack(selectedTrack, sound.ctx.currentTime, radius, clip);
      }


      let draggedToken = null;
      let pointerDownPos = null;
      let didDragMove = false;

      function getCanvasLocalCoords(e) {
        const rect = mainDisc.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      }

      function handleDiscDown(e) {
        sound.ensureContext();
        const pos = getCanvasLocalCoords(e);
        pointerDownPos = pos; didDragMove = false;

        const clip = sessionClips[selectedTrack][selectedRow];
        const phase = trackSpinPhase[selectedTrack];

        for (let i = clip.tokens.length - 1; i >= 0; i--) {
          const tp = getTokenScreenPos(clip.tokens[i], phase);
          if (Math.hypot(pos.x - tp.x, pos.y - tp.y) <= 18) {
            draggedToken = clip.tokens[i];
            return;
          }
        }
        draggedToken = null;
      }

      function handleDiscMove(e) {
        if (!pointerDownPos) return;
        const pos = getCanvasLocalCoords(e);
        if (Math.hypot(pos.x - pointerDownPos.x, pos.y - pointerDownPos.y) > 5) didDragMove = true;
        if (draggedToken && didDragMove) {
          const polar = coordsToDiscPolar(pos.x, pos.y);
          if (polar) {
            const def = activeGenre.tracks[selectedTrack];
            if (isSnapTrack(def)) {
              const len = def.scale.length;
              const newRadius = snapRadius(polar.radius, len);
              const changed = radiusToIndex(newRadius, len) !== radiusToIndex(draggedToken.radius, len);
              draggedToken.step = polar.step;
              draggedToken.radius = newRadius;
              if (changed) previewNote(newRadius, sessionClips[selectedTrack][selectedRow]);
            } else {
              draggedToken.step = polar.step;
              draggedToken.radius = polar.radius;
            }
          }
        }
      }
 
      function handleDiscUp() {
        if (!pointerDownPos) return;
        const clip = sessionClips[selectedTrack][selectedRow];
 
        if (!didDragMove) {
          if (draggedToken) {
            const idx = clip.tokens.indexOf(draggedToken);
            if (idx >= 0) clip.tokens.splice(idx, 1);
          } else {
            const polar = coordsToDiscPolar(pointerDownPos.x, pointerDownPos.y);
            if (polar) {
              const def = activeGenre.tracks[selectedTrack];
              const snap = isSnapTrack(def);
              const len = def.scale.length;
              const radius = snap ? snapRadius(polar.radius, len) : polar.radius;
              const existingIdx = clip.tokens.findIndex(t => t.step === polar.step && (snap
                ? radiusToIndex(t.radius, len) === radiusToIndex(radius, len)
                : Math.abs(t.radius - radius) < 0.08));
              if (existingIdx >= 0) {
                clip.tokens.splice(existingIdx, 1);
              } else {
                clip.tokens.push({ step: polar.step, radius });
                if (!isPlaying) clip.active = true;
                const now = sound.ctx.currentTime;
                sound.triggerTrack(selectedTrack, now, radius, clip);
              }
            }
          }
          updateSessionPadVisuals();
        }
        pointerDownPos = null; draggedToken = null; didDragMove = false;
      }

      mainDisc.addEventListener('mousedown', (e) => { e.preventDefault(); handleDiscDown(e); });
      window.addEventListener('mousemove', handleDiscMove);
      window.addEventListener('mouseup', handleDiscUp);
      mainDisc.addEventListener('touchstart', (e) => {
        if (e.touches.length > 0) { e.preventDefault(); handleDiscDown(e); }
      }, { passive: false });
      window.addEventListener('touchmove', (e) => {
        if (pointerDownPos && e.touches.length > 0) handleDiscMove(e);
      }, { passive: false });
      window.addEventListener('touchend', handleDiscUp);

      // =========================================================================
      // 7. ANIMATION LOOP
      // =========================================================================
      function updateSpinPhases() {
        if (!isPlaying || !sound.ctx) return;
        const barSec = (60 / bpm) * 4;
        const elapsedInBar = sound.ctx.currentTime - lastScheduledBarStart;
        let phase = (elapsedInBar / barSec) % 1;
        if (phase < 0) phase += 1;

        for (let t = 0; t < 5; t++) {
          const hasActive = sessionClips[t].some(c => c.active);
          if (hasActive || (recState === 'recording' && t === selectedTrack)) {
            const div = getTrackDiv(t);
            if (div > 1) {
              const total = Math.max(0, barCounter) + elapsedInBar / barSec;
              trackSpinPhase[t] = (((total % div) + div) % div) / div;
            } else {
              trackSpinPhase[t] = phase;
            }
          }
        }
      }

      function renderMainDisc() {
        const { cx, cy, r, innerR, outerR } = discGeo;
        mainCtx.clearRect(0, 0, mainDisc.width, mainDisc.height);

        const clip = sessionClips[selectedTrack][selectedRow];
        const phase = trackSpinPhase[selectedTrack];
        const accentCol = activeGenre.theme.accent;

        mainCtx.beginPath();
        mainCtx.arc(cx, cy, r, 0, Math.PI * 2);
        mainCtx.fillStyle = '#080808';
        mainCtx.fill();
        mainCtx.lineWidth = 2.5;
        mainCtx.strokeStyle = accentCol;
        mainCtx.stroke();

        if (recState === 'recording' && sound.ctx && recDurationSec > 0) {
          const prog = Math.max(0, Math.min(1, (sound.ctx.currentTime - recStartBarTime) / recDurationSec));
          mainCtx.beginPath();
          mainCtx.arc(cx, cy, r - 2, -Math.PI / 2, -Math.PI / 2 + prog * Math.PI * 2);
          mainCtx.lineWidth = 4;
          mainCtx.strokeStyle = '#ff1155';
          mainCtx.stroke();
        }

        mainCtx.save();
        mainCtx.translate(cx, cy);

        mainCtx.beginPath();
        mainCtx.arc(0, 0, outerR, 0, Math.PI * 2);
        mainCtx.fillStyle = '#0d0d0d';
        mainCtx.fill();

        // 波形描画
        const buffer = clip.audioBuffer || (activeGenre.tracks[selectedTrack].sampleType ? sound.sampleBuffers[activeGenre.tracks[selectedTrack].sampleType] : null);
        if (buffer) {
          const chData = buffer.getChannelData(0);
          const samples = 128;
          const stepIdx = Math.floor(chData.length / samples);
          mainCtx.beginPath();
          for (let i = 0; i <= samples; i++) {
            const idx = Math.min(chData.length - 1, (i % samples) * stepIdx);
            const amp = Math.abs(chData[idx]);
            const ang = -Math.PI / 2 + (i / samples) * Math.PI * 2;
            const wr = innerR + (outerR - innerR) * (0.48 + amp * 0.38);
            const wx = Math.cos(ang) * wr;
            const wy = Math.sin(ang) * wr;
            if (i === 0) mainCtx.moveTo(wx, wy);
            else mainCtx.lineTo(wx, wy);
          }
          mainCtx.strokeStyle = accentCol;
          mainCtx.lineWidth = 1.5;
          mainCtx.stroke();
        }

        [0.33, 0.66, 1.0].forEach(ratio => {
          mainCtx.beginPath();
          mainCtx.arc(0, 0, innerR + (outerR - innerR) * ratio, 0, Math.PI * 2);
          mainCtx.strokeStyle = '#222222';
          mainCtx.lineWidth = 1;
          mainCtx.stroke();
        });

        for (let s = 0; s < STEPS_PER_BAR; s++) {
          const ang = -Math.PI / 2 + (s / STEPS_PER_BAR) * Math.PI * 2;
          const isBeat = s % 4 === 0;
          mainCtx.beginPath();
          mainCtx.moveTo(Math.cos(ang) * innerR, Math.sin(ang) * innerR);
          mainCtx.lineTo(Math.cos(ang) * outerR, Math.sin(ang) * outerR);
          mainCtx.strokeStyle = isBeat ? '#444444' : '#1c1c1c';
          mainCtx.lineWidth = isBeat ? 1.5 : 1;
          mainCtx.stroke();
        }

        mainCtx.restore();

        mainCtx.save();
        mainCtx.translate(cx, cy);
        mainCtx.rotate(phase * Math.PI * 2);
        mainCtx.translate(-cx, -cy);
        mainCtx.beginPath();
        mainCtx.moveTo(cx, cy - innerR);
        mainCtx.lineTo(cx, cy - outerR - 2);
        mainCtx.strokeStyle = accentCol;
        mainCtx.lineWidth = 2.5;
        mainCtx.shadowColor = accentCol;
        mainCtx.shadowBlur = 8;
        mainCtx.stroke();

        mainCtx.fillStyle = accentCol;
        mainCtx.beginPath();
        mainCtx.moveTo(cx, cy - outerR + 2);
        mainCtx.lineTo(cx - 4, cy - outerR - 5);
        mainCtx.lineTo(cx + 4, cy - outerR - 5);
        mainCtx.closePath();
        mainCtx.fill();
        mainCtx.restore();

        for (const tok of clip.tokens) {
          const pos = getTokenScreenPos(tok, phase);
          let dph = Math.abs(phase - tok.step / STEPS_PER_BAR);
          dph = Math.min(dph, 1 - dph);
          const isTriggered = isPlaying && dph < 0.03;

          mainCtx.save();
          mainCtx.beginPath();
          mainCtx.arc(pos.x, pos.y, isTriggered ? 9 : 7, 0, Math.PI * 2);
          mainCtx.fillStyle = isTriggered ? '#ffffff' : accentCol;
          mainCtx.shadowColor = accentCol;
          mainCtx.shadowBlur = isTriggered ? 14 : 6;
          mainCtx.fill();

          mainCtx.lineWidth = 2;
          mainCtx.strokeStyle = '#000000';
          mainCtx.stroke();
          mainCtx.restore();
        }

        mainCtx.beginPath();
        mainCtx.arc(cx, cy, innerR, 0, Math.PI * 2);
        mainCtx.fillStyle = '#111111';
        mainCtx.fill();
        mainCtx.lineWidth = 2;
        mainCtx.strokeStyle = accentCol;
        mainCtx.stroke();

        mainCtx.beginPath();
        mainCtx.arc(cx, cy, innerR * 0.35, 0, Math.PI * 2);
        mainCtx.fillStyle = accentCol;
        mainCtx.fill();
      }

      function renderMiniDiscs() {
        for (const item of miniDiscItems) {
          const { t, r, canvas, ctx } = item;
          const w = canvas.width; const h = canvas.height;
          if (w === 0 || h === 0) continue;

          ctx.clearRect(0, 0, w, h);
          const cx = w / 2; const cy = h / 2; const rad = Math.min(cx, cy) - 2;

          const clip = sessionClips[t][r];
          const phase = clip.active ? trackSpinPhase[t] : 0;
          const accentCol = activeGenre.theme.accent;

          ctx.beginPath();
          ctx.arc(cx, cy, rad, 0, Math.PI * 2);
          ctx.fillStyle = '#101010';
          ctx.fill();
          ctx.lineWidth = clip.active ? 1.5 : 1;
          ctx.strokeStyle = clip.active ? accentCol : '#282828';
          ctx.stroke();

          for (const tok of clip.tokens) {
            const d = rad * (0.28 + tok.radius * 0.62);
            const ang = -Math.PI / 2 + (tok.step / STEPS_PER_BAR) * Math.PI * 2;
            ctx.beginPath();
            ctx.arc(cx + Math.cos(ang) * d, cy + Math.sin(ang) * d, 2, 0, Math.PI * 2);
            ctx.fillStyle = accentCol;
            ctx.fill();
          }

          if (clip.active) {
            const na = -Math.PI / 2 + phase * Math.PI * 2;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(na) * rad, cy + Math.sin(na) * rad);
            ctx.strokeStyle = accentCol;
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }

          ctx.beginPath();
          ctx.arc(cx, cy, rad * 0.22, 0, Math.PI * 2);
          ctx.fillStyle = '#000000';
          ctx.fill();
        }
      }

      function animationLoop() {
        updateSpinPhases();
        renderMainDisc();
        renderMiniDiscs();
        requestAnimationFrame(animationLoop);
      }

      // =========================================================================
      // 8. INITIALIZATION
      // =========================================================================
      setGenre('techno');
      resizeAllCanvases();

      const ro = new ResizeObserver(() => { resizeAllCanvases(); });
      ro.observe(document.getElementById('app-chassis'));
      window.addEventListener('resize', resizeAllCanvases);

      requestAnimationFrame(animationLoop);
    })();
  </script>
</body>
</html>
