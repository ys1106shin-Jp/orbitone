<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Tri-Genre Sound Matrix: Techno / Digicore / Botanica</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: var(--c-bg, #000000); font-family: 'Inter', system-ui, sans-serif; color: var(--c-main, #ffffff); transition: background-color 0.3s ease; }
    #app-chassis { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--c-bg, #000000); display: flex; flex-direction: column; }
    #bg-splash-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

    /* ジャンルセレクター */
    .genre-bar { position: relative; z-index: 10; display: flex; gap: 6px; padding: 6px 8px 0 8px; justify-content: center; }
    .genre-tab { flex: 1; max-width: 130px; height: 26px; border-radius: 8px; font-size: 10px; font-weight: 900; letter-spacing: 0.06em; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1.5px solid #333333; background: #111111; color: #888888; transition: all 0.2s ease; }
    .genre-tab.active { background: var(--c-accent); color: #000000; border-color: var(--c-accent); box-shadow: 0 0 10px var(--c-accent); }

    .chassis-grid { position: relative; z-index: 2; width: 100%; flex: 1; display: grid; grid-template-columns: 1fr; grid-template-rows: 34% 78px 1fr; gap: 6px; padding: 6px; overflow: hidden; min-height: 0; }
    @media (orientation: landscape) and (min-width: 520px) {
      .chassis-grid { grid-template-columns: 33% 76px 1fr; grid-template-rows: 100%; gap: 8px; padding: 8px; }
    }

    .hw-panel { border-radius: 16px; overflow: hidden; }
    .session-panel { display: flex; flex-direction: column; padding: 4px; gap: 4px; }
    .track-headers { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; flex-shrink: 0; }
    .track-pill { text-align: center; font-size: 8px; font-weight: 900; letter-spacing: 0.04em; padding: 4px 1px; border-radius: 8px; cursor: pointer; transition: all 0.12s ease; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: #111111; color: var(--c-main); border: 1.5px solid #282828; }
    .track-pill.selected { background: var(--c-accent); color: #000000; border-color: var(--c-accent); font-weight: 900; }

    .session-grid { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(4, 1fr); gap: 4px; min-height: 0; }
    .session-pad { position: relative; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; transition: border-color 0.12s ease, transform 0.08s ease; background: #0c0c0c; border: 1.5px solid #222222; }
    .session-pad:active { transform: scale(0.95); }
    .session-pad.selected { border: 2px solid var(--c-accent); box-shadow: 0 0 10px var(--c-accent); }
    .session-pad.queued { animation: padBlinkPlay 0.28s infinite alternate; }
    .session-pad.queued-stop { animation: padBlinkStop 0.28s infinite alternate; }
    @keyframes padBlinkPlay { from { border-color: #222222; } to { border-color: var(--c-accent); background: #163620; } }
    @keyframes padBlinkStop { from { border-color: var(--c-accent); } to { border-color: #444444; background: #331111; } }

    .mini-disc-canvas { display: block; pointer-events: none; }

    .knob-panel { display: flex; flex-direction: row; align-items: center; justify-content: space-around; padding: 4px 8px; gap: 4px; }
    @media (orientation: landscape) and (min-width: 520px) { .knob-panel { flex-direction: column; padding: 8px 4px; } }
    .knob-unit { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 100%; }
    .rotary-knob { position: relative; width: 44px; height: 44px; border-radius: 50%; cursor: ns-resize; touch-action: none; background: #111111; border: 2px solid #383838; }
    @media (orientation: landscape) and (min-width: 520px) { .rotary-knob { width: 48px; height: 48px; } }
    .knob-ring-svg { position: absolute; inset: -4px; width: calc(100% + 8px); height: calc(100% + 8px); pointer-events: none; }
    .knob-pointer { position: absolute; top: 4px; left: 50%; width: 3px; height: 14px; margin-left: -1.5px; border-radius: 2px; transform-origin: 50% 16px; pointer-events: none; background: var(--c-accent); }
    @media (orientation: landscape) and (min-width: 520px) { .knob-pointer { height: 15px; transform-origin: 50% 18px; } }
    .knob-label { font-size: 8px; font-weight: 900; letter-spacing: 0.05em; text-transform: uppercase; text-align: center; line-height: 1; color: #888888; }

    .mode-badge { font-size: 7px; font-weight: 900; padding: 2px 4px; border-radius: 4px; text-transform: uppercase; border: 1.5px solid #333333; color: #888888; background: #111111; cursor: pointer; }
    .mode-badge.sampler { border-color: var(--c-accent); color: var(--c-accent); }

    .random-action-btn { width: 46px; height: 46px; border-radius: 12px; font-size: 8px; font-weight: 900; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; transition: transform 0.08s ease; background: #111111; color: var(--c-accent); border: 2px solid var(--c-accent); }
    .random-action-btn:active { transform: scale(0.92); }

    .right-column { display: grid; grid-template-columns: 1fr 84px; grid-template-rows: 100%; gap: 6px; min-width: 0; min-height: 0; }
    @media (orientation: landscape) and (min-width: 520px) { .right-column { grid-template-columns: 100%; grid-template-rows: 1fr 54px; gap: 8px; } }
    .disc-panel { position: relative; display: flex; align-items: center; justify-content: center; padding: 2px; min-width: 0; min-height: 0; }
    #main-disc-canvas { display: block; cursor: pointer; touch-action: none; }

    .transport-panel { display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 6px 4px; gap: 6px; }
    @media (orientation: landscape) and (min-width: 520px) { .transport-panel { flex-direction: row; padding: 4px 10px; gap: 8px; } }
    
    .hw-btn { height: 36px; width: 100%; padding: 0 8px; border-radius: 12px; font-size: 11px; font-weight: 900; letter-spacing: 0.05em; display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; transition: all 0.1s ease; border: 2px solid #333333; background: #111111; color: var(--c-main); flex-shrink: 0; }
    @media (orientation: landscape) and (min-width: 520px) { .hw-btn { width: auto; padding: 0 12px; } }
    .hw-btn:active { transform: scale(0.95); }

    .btn-play.playing { background: var(--c-accent); color: #000000; border-color: var(--c-accent); box-shadow: 0 0 12px var(--c-accent); }
    .btn-rec { color: #ff3366; border-color: #551122; }
    .btn-rec.armed { background: #441122; color: #ffaa33; border-color: #ffaa33; animation: recPulse 0.4s infinite alternate; }
    .btn-rec.recording { background: #ff1155; color: #ffffff; border-color: #ffffff; box-shadow: 0 0 14px rgba(255,17,85,0.8); animation: recPulse 0.25s infinite alternate; }
    @keyframes recPulse { from { opacity: 0.75; } to { opacity: 1; } }

    .bpm-knob-box { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 12px; padding: 2px 4px; width: 100%; flex-shrink: 0; }
    @media (orientation: landscape) and (min-width: 520px) { .bpm-knob-box { flex-direction: row; width: auto; padding: 3px 8px; gap: 6px; } }
    .bpm-rotary { position: relative; width: 34px; height: 34px; border-radius: 50%; cursor: ns-resize; touch-action: none; flex-shrink: 0; background: #111111; border: 2px solid #383838; }
    .bpm-pointer { position: absolute; top: 3px; left: 50%; width: 2.5px; height: 11px; margin-left: -1.25px; border-radius: 2px; transform-origin: 50% 12px; pointer-events: none; background: var(--c-accent); }
    .bpm-readout { display: flex; flex-direction: column; align-items: center; line-height: 1; }
    .bpm-val { font-size: 13px; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--c-accent); }
    .bpm-tag { font-size: 7px; font-weight: 900; letter-spacing: 0.06em; color: #888888; }
  </style>
</head>
<body>
  <div id="app-chassis">
    <!-- ジャンル切替タブ -->
    <header class="genre-bar">
      <button class="genre-tab active" data-genre="techno">TECHNO</button>
      <button class="genre-tab" data-genre="digicore">HYPERPOP</button>
      <button class="genre-tab" data-genre="botanica">BOTANICA</button>
    </header>

    <canvas id="bg-splash-canvas"></canvas>

    <div class="chassis-grid">
      <section class="hw-panel session-panel" aria-label="Session View">
        <div class="track-headers" id="track-headers"></div>
        <div class="session-grid" id="session-grid"></div>
      </section>

      <section class="hw-panel knob-panel" id="knob-panel" aria-label="Track Controls"></section>

      <div class="right-column">
        <section class="hw-panel disc-panel" id="disc-panel" aria-label="Disc Sequencer">
          <canvas id="main-disc-canvas"></canvas>
        </section>

        <section class="hw-panel transport-panel" aria-label="Transport Controls">
          <button id="btn-play" class="hw-btn btn-play" type="button">
            <span id="play-icon">&#9654;</span>
            <span id="play-text">PLAY</span>
          </button>

          <button id="btn-rec" class="hw-btn btn-rec" type="button">
            <span>&#9679;</span>
            <span id="rec-text">REC</span>
          </button>

          <div class="bpm-knob-box" title="ドラッグでBPM調整">
            <div class="bpm-rotary" id="bpm-knob">
              <div class="bpm-pointer" id="bpm-pointer"></div>
            </div>
            <div class="bpm-readout">
              <span class="bpm-val" id="bpm-display">135</span>
              <span class="bpm-tag">BPM</span>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script>
    (() => {
      // =========================================================================
      // 1. GENRE PRESETS (ジャンル別サウンド設計)
      // =========================================================================

      // ★ 初期サンプル設定：track = トラック番号(0〜4)、row = 行番号(0〜3)、url = 音声ファイル
      // サンプラートラック(mode: 'sampler')だけ指定できる
      const DEFAULT_SAMPLES = {
        techno:   [ { track: 4, row: 0, url: 'samples/techno1.mp3' } ],
        botanica: [ { track: 4, row: 0, url: 'samples/nature1.mp3' } ]
      };
      const GENRE_PRESETS = {
        techno: {
          name: 'TECHNO',
          bpm: 135,
          theme: { bg: '#000000', main: '#ffffff', accent: '#00ff66' },
          tracks: [
            { id: 'kick',  name: '909 KICK',  mode: 'synth',   synthType: 'kick',    scale: [36], pitched: false },
            { id: 'hihat', name: '909 HAT',   mode: 'synth',   synthType: 'hihat',   scale: [60], pitched: false },
            { id: 'weird', name: 'WEIRD',     mode: 'synth',   synthType: 'weird',   scale: [0, 3, 7, 10, 12], pitched: false },
            { id: 'acid',  name: 'ACID 303',  mode: 'synth',   synthType: 'acid',    scale: [55, 65.41, 73.42, 82.41, 98, 110, 130.81, 146.83, 164.81, 196, 220], pitched: false },
            { id: 'voice', name: 'VOICE/REC', mode: 'sampler', sampleType: 'voice',  scale: [-12, -9, -7, -5, -2, 0, 3, 5, 7, 10, 12], pitched: true }
          ]
        },
        digicore: {
          name: 'HYPERPOP',
          bpm: 160,
          theme: { bg: '#ffffff', main: '#00f0ff', accent: '#ff007f' },
          tracks: [
            { id: 'kick', name: 'HYPER KICK', mode: 'synth', synthType: 'kick', scale: [36], pitched: false },
            // ─────────── 1: DIRTY BASS（歪んだベース）───────────
            { id: 'bass', name: 'DIRTY BASS', mode: 'synth', synthType: 'patch', pitched: true,
              scale: [-24, -22, -20, -17, -15, -12, -10, -8],
              // ① 基本
              volume: 0.55, pan: 0, mono: false, speed: 1,
              // ② 音源
              osc1Wave: 'sawtooth', osc1Level: 0.5, osc1Octave: 0,  osc1Detune: 0,
              osc2Wave: 'square',   osc2Level: 0.5, osc2Octave: -1, osc2Detune: 8,
              noiseLevel: 0, unison: 1, unisonDetune: 0, unisonSpread: 0, chord: [0], octaveOffset: 0,
              // ③ ピッチの動き
              fixedFreq: 0, glide: 0.03, pitchStart: 0, pitchStartTime: 0, pitchEnd: 0, pitchEndTime: 0, fade: 0,
              // ④ FM
              fmRatio: 0, fmWave: 'sine', fmDepth: 0, fmDepthEnd: 0, fmDecay: 1, fmCutoffLink: 0,
              // ⑤ LFO
              lfoTarget: 'none', lfoWave: 'sine', lfoRate: 5, lfoDepth: 0,
              // ⑥ フィルター
              filterType: 'lowpass', cutoff: 300, cutoffRange: 3000, radiusCutoff: 1500, q: 3, qRange: 18,
              filterEnv: true, filterEnvDrop: 0.5, filterEnvTime: 0.85, filterMin: 60,
              // ⑦ 音量の形・長さ
              attack: 0.004, decayTime: 0.1, sustain: 0.7, release: 0.05, lengthScale: 10, lengthMin: 0.5,
              // ⑧ 歪み
              drive: 0.6, driveRange: 1 },
 
            // ─────────── 2: SQUARE PLUCK（スクエアプラック）───────────
            { id: 'pluck', name: 'SQUARE PLUCK', mode: 'synth', synthType: 'patch', pitched: true,
              scale: [0, 2, 4, 7, 9, 12, 14, 16, 19, 21],
              volume: 0.5, pan: 0, mono: false, speed: 1,
              osc1Wave: 'square', osc1Level: 1, osc1Octave: 0, osc1Detune: 0,
              osc2Wave: 'none',   osc2Level: 1, osc2Octave: 0, osc2Detune: 0,
              noiseLevel: 0, unison: 1, unisonDetune: 0, unisonSpread: 0, chord: [0], octaveOffset: 12,
              fixedFreq: 0, glide: 0.0375, pitchStart: 0, pitchStartTime: 0, pitchEnd: 0, pitchEndTime: 0, fade: 0,
              fmRatio: 0, fmWave: 'sine', fmDepth: 0, fmDepthEnd: 0, fmDecay: 1, fmCutoffLink: 0,
              lfoTarget: 'none', lfoWave: 'sine', lfoRate: 5, lfoDepth: 0,
              filterType: 'lowpass', cutoff: 600, cutoffRange: 6000, radiusCutoff: 0, q: 2, qRange: 10,
              filterEnv: false, filterEnvDrop: 0.1, filterEnvTime: 0.85, filterMin: 60,
              attack: 0.002, decayTime: 0, sustain: 0, release: 0.01, lengthScale: 5, lengthMin: 0.5,glide: 0,
              drive: 0, driveRange: 1 },
 
            // ─────────── 3: GLIDE LEAD（グライドスクエアリード）───────────
            { id: 'lead', name: 'GLIDE LEAD', mode: 'synth', synthType: 'patch', pitched: true,
              scale: [-12, -10, -8, -5, -3, 0, 2, 4, 7],
              volume: 0.5, pan: 0, mono: true, speed: 0.5,
              osc1Wave: 'square', osc1Level: 0.5, osc1Octave: 0, osc1Detune: 0,
              osc2Wave: 'square', osc2Level: 0.5, osc2Octave: 0, osc2Detune: 10,
              noiseLevel: 0, unison: 1, unisonDetune: 0, unisonSpread: 0, chord: [0], octaveOffset: 12,
              fixedFreq: 0, glide: 0.09, pitchStart: 0, pitchStartTime: 0, pitchEnd: 0, pitchEndTime: 0, fade: 0,
              fmRatio: 0, fmWave: 'sine', fmDepth: 0, fmDepthEnd: 0, fmDecay: 1, fmCutoffLink: 0,
              lfoTarget: 'none', lfoWave: 'sine', lfoRate: 5, lfoDepth: 0,
              filterType: 'lowpass', cutoff: 1500, cutoffRange: 6000, radiusCutoff: 1500, q: 2, qRange: 18,
              filterEnv: true, filterEnvDrop: 0.5, filterEnvTime: 0.85, filterMin: 60,
              attack: 0.01, decayTime: 0.15, sustain: 0.8, release: 0.08, lengthScale: 12, lengthMin: 0.5,
              drive: 0.1, driveRange: 1 },
 
            // ─────────── 4: KAWAII CHORD（スーパーソー。和音は同じ位置に複数の音を置いて作る）───────────
            { id: 'chord', name: 'KAWAII CHORD', mode: 'synth', synthType: 'patch', pitched: true,
              scale: [0, 2, 4, 5, 7, 9, 11, 12, 14, 16, 17, 19],
              volume: 0.3, pan: 0, mono: true, monoFade: 0.1, speed: 0.25,
              osc1Wave: 'sawtooth', osc1Level: 0.6, osc1Octave: 0, osc1Detune: 0,
              osc2Wave: 'none',     osc2Level: 1,   osc2Octave: 0, osc2Detune: 0,
              noiseLevel: 0, unison: 3, unisonDetune: 14, unisonSpread: 0.7, octaveOffset: 0,
              fixedFreq: 0, glide: 0, pitchStart: -18, pitchStartTime: 0.1, pitchEnd: -18, pitchEndTime: 0.1, fade: 0.1,
              fmRatio: 0, fmWave: 'sine', fmDepth: 0, fmDepthEnd: 0, fmDecay: 1, fmCutoffLink: 0,
              lfoTarget: 'none', lfoWave: 'sine', lfoRate: 5, lfoDepth: 0,
              filterType: 'lowpass', cutoff: 1200, cutoffRange: 9000, radiusCutoff: 0, q: 0.7, qRange: 5,
              filterEnv: true, filterEnvDrop: 0.5, filterEnvTime: 1, filterMin: 400,
              attack: 0.1, decayTime: 0, sustain: 1, release: 0.1, lengthScale: 12, lengthMin: 0.5, lengthSteps: 16,
              drive: 0, driveRange: 0.7 }
          ]
        },
        botanica: {
          name: 'BOTANICA',
          bpm: 96,
          theme: { bg: '#08120c', main: '#e8eedd', accent: '#62d26f' },
          tracks: [
            { id: 'kick',  name: 'WOOD KICK', mode: 'synth',   synthType: 'kick',    scale: [36], pitched: false },
            { id: 'shaker',name: 'BRANCH/SHK',mode: 'synth',   synthType: 'hihat',   scale: [60], pitched: false },
            { id: 'kalimba',name:'KALIMBA',   mode: 'sampler', sampleType: 'kalimba',scale: [-12, -7, -5, 0, 2, 7, 9, 12, 14, 19], pitched: true },
            { id: 'flute', name: 'BAMBOO/PAD',mode: 'synth',   synthType: 'triangle',scale: [-12, -5, 0, 2, 7, 12, 14, 19], pitched: true },
            { id: 'nature',name: 'NATURE/REC',mode: 'sampler', sampleType: 'voice',  scale: [-12, -7, -5, 0, 2, 7, 9, 12], pitched: true }
          ]
        }
      };

      let currentGenreKey = 'techno';
      let activeGenre = GENRE_PRESETS[currentGenreKey];

      const STEPS_PER_BAR = 16;
      const MIN_BPM = 70;
      const MAX_BPM = 190;

      let bpm = activeGenre.bpm;
      let isPlaying = false;
      let selectedTrack = 0;
      let selectedRow = 0;
      let recState = 'off';

      let currentStep = 0;
      let nextNoteTime = 0;
      let lastScheduledBarStart = 0;
      let barCounter = -1;
      let schedulerTimer = null;

      let mediaStream = null;
      let mediaRecorder = null;
      let recChunks = [];
      let recStartBarTime = 0;
      let recDurationSec = 0;

      const trackSpinPhase = [0, 0, 0, 0, 0];

      // 各トラックのノブエフェクト値
      const trackParams = [
        { cutoff: 0.65, reso: 0.5, decay: 0.5, drive: 0.25 },
        { cutoff: 0.50, reso: 0.4, decay: 0.4, drive: 0.15 },
        { cutoff: 0.75, reso: 0.6, decay: 0.6, drive: 0.30 },
        { cutoff: 0.60, reso: 0.5, decay: 0.5, drive: 0.20 },
        { cutoff: 0.70, reso: 0.4, decay: 0.7, drive: 0.10 }
      ];

      // クリップデータ (5トラック × 4行)
      const sessionClips = Array.from({ length: 5 }, () =>
        Array.from({ length: 4 }, () => ({
          tokens: [],
          active: false,
          queued: false,
          queuedStop: false,
          audioBuffer: null
        }))
      );

      // =========================================================================
      // 1b. COMMON SYNTH PARAMETER MODEL
      // データのみ。既存の再生経路、プリセット、音声エンジンには未接続。
      // outputGain は入力項目ではなく createCommonSynthParams() の派生値。
      // =========================================================================
      const COMMON_SYNTH_WAVES = Object.freeze(['sine', 'square', 'sawtooth', 'triangle']);
      const COMMON_SYNTH_SAFE_PEAK = 0.3;
      const COMMON_SYNTH_KEYS = Object.freeze([
        'name', 'mode', 'scale', 'speed', 'volume', 'pan', 'mono', 'octaveOffset',
        'osc1Wave', 'osc1Level', 'osc1Octave', 'osc2Wave', 'osc2Level', 'osc2Octave', 'osc2Detune',
        'noiseLevel', 'unison', 'unisonDetune', 'unisonSpread', 'chord',
        'fmEnabled', 'fmWave', 'fmRatio', 'fmIndex', 'fmLevel', 'fmAttack', 'fmDecay', 'fmSustain', 'fmRelease',
        'fixedFreq', 'glide', 'pitchStart', 'pitchStartTime', 'pitchEnd', 'pitchEndTime',
        'lfoTarget', 'lfoWave', 'lfoRate', 'lfoDepth',
        'filterType', 'cutoff', 'cutoffRange', 'radiusCutoff', 'q', 'qRange', 'filterEnv', 'filterEnvDrop',
        'attack', 'decayTime', 'sustain', 'release', 'lengthScale', 'lengthMin',
        'drive', 'driveRange', 'sample', 'pitched'
      ]);
      const COMMON_SYNTH_DEFAULTS = Object.freeze({
        name: 'untitled',
        mode: 'synth',
        scale: Object.freeze([0]),
        speed: 1,
        volume: 0.5,
        pan: 0,
        mono: false,
        octaveOffset: 0,
        osc1Wave: 'sawtooth',
        osc1Level: 1,
        osc1Octave: 0,
        osc2Wave: 'sawtooth',
        osc2Level: 0,
        osc2Octave: 0,
        osc2Detune: 0,
        noiseLevel: 0,
        unison: 1,
        unisonDetune: 0,
        unisonSpread: 0,
        chord: Object.freeze([]),
        fmEnabled: false,
        fmWave: 'sine',
        fmRatio: 1,
        fmIndex: 0,
        fmLevel: 0,
        fmAttack: 0.01,
        fmDecay: 0.2,
        fmSustain: 0.3,
        fmRelease: 0.1,
        fixedFreq: null,
        glide: 0,
        pitchStart: 0,
        pitchStartTime: 0.01,
        pitchEnd: 0,
        pitchEndTime: 0.05,
        lfoTarget: 'none',
        lfoWave: 'sine',
        lfoRate: 5,
        lfoDepth: 0,
        filterType: 'lowpass',
        cutoff: 2000,
        cutoffRange: 0,
        radiusCutoff: 0,
        q: 0.7,
        qRange: 0,
        filterEnv: false,
        filterEnvDrop: 0.5,
        attack: 0.01,
        decayTime: 0.12,
        sustain: 0.7,
        release: 0.08,
        lengthScale: 1,
        lengthMin: 0.05,
        drive: 0,
        driveRange: 0,
        sample: null,
        pitched: true
      });
      const COMMON_SYNTH_ENUM_FIELDS = Object.freeze([
        Object.freeze({ key: 'mode', allowed: Object.freeze(['synth', 'sampler']) }),
        Object.freeze({ key: 'osc1Wave', allowed: COMMON_SYNTH_WAVES }),
        Object.freeze({ key: 'osc2Wave', allowed: COMMON_SYNTH_WAVES }),
        Object.freeze({ key: 'fmWave', allowed: COMMON_SYNTH_WAVES }),
        Object.freeze({ key: 'lfoWave', allowed: COMMON_SYNTH_WAVES }),
        Object.freeze({ key: 'lfoTarget', allowed: Object.freeze(['none', 'pitch', 'cutoff', 'amp', 'fm']) }),
        Object.freeze({ key: 'filterType', allowed: Object.freeze(['lowpass', 'highpass', 'bandpass', 'notch', 'none']) })
      ]);
      const COMMON_SYNTH_NUMBER_FIELDS = Object.freeze([
        Object.freeze({ key: 'speed', min: 0.0625, max: 1, integer: false }),
        Object.freeze({ key: 'volume', min: 0, max: 0.8, integer: false }),
        Object.freeze({ key: 'pan', min: -1, max: 1, integer: false }),
        Object.freeze({ key: 'octaveOffset', min: -48, max: 48, integer: false }),
        Object.freeze({ key: 'osc1Level', min: 0, max: 1, integer: false }),
        Object.freeze({ key: 'osc1Octave', min: -4, max: 4, integer: true }),
        Object.freeze({ key: 'osc2Level', min: 0, max: 1, integer: false }),
        Object.freeze({ key: 'osc2Octave', min: -4, max: 4, integer: true }),
        Object.freeze({ key: 'osc2Detune', min: -100, max: 100, integer: false }),
        Object.freeze({ key: 'noiseLevel', min: 0, max: 1, integer: false }),
        Object.freeze({ key: 'unison', min: 1, max: 7, integer: true }),
        Object.freeze({ key: 'unisonDetune', min: 0, max: 50, integer: false }),
        Object.freeze({ key: 'unisonSpread', min: 0, max: 1, integer: false }),
        Object.freeze({ key: 'fmRatio', min: 0.125, max: 16, integer: false }),
        Object.freeze({ key: 'fmIndex', min: 0, max: 12, integer: false }),
        Object.freeze({ key: 'fmLevel', min: 0, max: 1, integer: false }),
        Object.freeze({ key: 'fmAttack', min: 0, max: 4, integer: false }),
        Object.freeze({ key: 'fmDecay', min: 0, max: 4, integer: false }),
        Object.freeze({ key: 'fmSustain', min: 0, max: 1, integer: false }),
        Object.freeze({ key: 'fmRelease', min: 0, max: 4, integer: false }),
        Object.freeze({ key: 'glide', min: 0, max: 2, integer: false }),
        Object.freeze({ key: 'pitchStart', min: -24, max: 24, integer: false }),
        Object.freeze({ key: 'pitchStartTime', min: 0.001, max: 2, integer: false }),
        Object.freeze({ key: 'pitchEnd', min: -24, max: 24, integer: false }),
        Object.freeze({ key: 'pitchEndTime', min: 0.001, max: 2, integer: false }),
        Object.freeze({ key: 'lfoRate', min: 0, max: 40, integer: false }),
        Object.freeze({ key: 'lfoDepth', min: 0, max: 1, integer: false }),
        Object.freeze({ key: 'cutoff', min: 20, max: 18000, integer: false }),
        Object.freeze({ key: 'cutoffRange', min: 0, max: 18000, integer: false }),
        Object.freeze({ key: 'radiusCutoff', min: 0, max: 8000, integer: false }),
        Object.freeze({ key: 'q', min: 0.0001, max: 20, integer: false }),
        Object.freeze({ key: 'qRange', min: 0, max: 20, integer: false }),
        Object.freeze({ key: 'filterEnvDrop', min: 0.05, max: 1, integer: false }),
        Object.freeze({ key: 'attack', min: 0, max: 4, integer: false }),
        Object.freeze({ key: 'decayTime', min: 0, max: 4, integer: false }),
        Object.freeze({ key: 'sustain', min: 0, max: 1, integer: false }),
        Object.freeze({ key: 'release', min: 0, max: 4, integer: false }),
        Object.freeze({ key: 'lengthScale', min: 0.1, max: 16, integer: false }),
        Object.freeze({ key: 'lengthMin', min: 0.02, max: 4, integer: false }),
        Object.freeze({ key: 'drive', min: 0, max: 0.9, integer: false }),
        Object.freeze({ key: 'driveRange', min: 0, max: 0.9, integer: false })
      ]);
      const COMMON_SYNTH_BOOL_FIELDS = Object.freeze(['mono', 'fmEnabled', 'filterEnv', 'pitched']);
      const COMMON_SYNTH_ARRAY_FIELDS = Object.freeze({
        scale: Object.freeze({ minLen: 1, maxLen: 32, min: -72, max: 72, elementFallback: 0 }),
        chord: Object.freeze({ minLen: 0, maxLen: 8, min: -36, max: 36, elementFallback: 0 })
      });
      const COMMON_SYNTH_VOICES = Object.create(null);

      function commonSynthOwn(src, key) {
        if (!src || !Object.prototype.hasOwnProperty.call(src, key)) return undefined;
        return src[key];
      }

      function commonSynthPlainObject(input) {
        if (!input || typeof input !== 'object' || Array.isArray(input)) return null;
        return input;
      }

      function sanitizeCommonSynthNumber(value, field, fallback) {
        if (typeof value !== 'number' || !Number.isFinite(value)) return fallback;
        let n = field.integer ? Math.round(value) : value;
        if (n < field.min) n = field.min;
        if (n > field.max) n = field.max;
        return n;
      }

      function sanitizeCommonSynthFixedFreq(value) {
        if (value === null || value === undefined) return null;
        if (typeof value === 'number' && Number.isFinite(value)) {
          if (value < 20) return 20;
          if (value > 8000) return 8000;
          return value;
        }
        return null;
      }

      function sanitizeCommonSynthNumberArray(value, limit) {
        if (!Array.isArray(value)) {
          const blank = [];
          while (blank.length < limit.minLen) blank.push(limit.elementFallback);
          return blank;
        }
        const next = [];
        const count = Math.min(value.length, limit.maxLen);
        for (let i = 0; i < count; i++) {
          const el = value[i];
          if (typeof el === 'number' && Number.isFinite(el)) {
            let n = el;
            if (n < limit.min) n = limit.min;
            if (n > limit.max) n = limit.max;
            next.push(n);
          } else {
            next.push(limit.elementFallback);
          }
        }
        while (next.length < limit.minLen) next.push(limit.elementFallback);
        return next;
      }

      function deriveCommonSynthOutputGain(params) {
        const levels = params.osc1Level + params.osc2Level + params.noiseLevel;
        const noteCount = Math.max(params.chord.length + 1, 1);
        const estimated = levels * params.unison * noteCount;
        const volume = params.volume;
        if (!(estimated > 0) || !(volume > 0)) return volume;
        if (estimated * volume > COMMON_SYNTH_SAFE_PEAK) return COMMON_SYNTH_SAFE_PEAK / estimated;
        return volume;
      }

      function createCommonSynthParams(input) {
        const src = commonSynthPlainObject(input);
        const out = {};
        const name = commonSynthOwn(src, 'name');
        out.name = (typeof name === 'string' && name.length > 0) ? name : COMMON_SYNTH_DEFAULTS.name;
        for (let i = 0; i < COMMON_SYNTH_ENUM_FIELDS.length; i++) {
          const field = COMMON_SYNTH_ENUM_FIELDS[i];
          const value = commonSynthOwn(src, field.key);
          out[field.key] = field.allowed.indexOf(value) !== -1 ? value : COMMON_SYNTH_DEFAULTS[field.key];
        }
        for (let i = 0; i < COMMON_SYNTH_NUMBER_FIELDS.length; i++) {
          const field = COMMON_SYNTH_NUMBER_FIELDS[i];
          out[field.key] = sanitizeCommonSynthNumber(
            commonSynthOwn(src, field.key),
            field,
            COMMON_SYNTH_DEFAULTS[field.key]
          );
        }
        for (let i = 0; i < COMMON_SYNTH_BOOL_FIELDS.length; i++) {
          const key = COMMON_SYNTH_BOOL_FIELDS[i];
          const value = commonSynthOwn(src, key);
          out[key] = typeof value === 'boolean' ? value : COMMON_SYNTH_DEFAULTS[key];
        }
        const sample = commonSynthOwn(src, 'sample');
        out.sample = typeof sample === 'string' ? sample : null;
        out.fixedFreq = sanitizeCommonSynthFixedFreq(commonSynthOwn(src, 'fixedFreq'));
        out.scale = sanitizeCommonSynthNumberArray(commonSynthOwn(src, 'scale'), COMMON_SYNTH_ARRAY_FIELDS.scale);
        out.chord = sanitizeCommonSynthNumberArray(commonSynthOwn(src, 'chord'), COMMON_SYNTH_ARRAY_FIELDS.chord);
        out.outputGain = deriveCommonSynthOutputGain(out);
        return out;
      }

      function pushCommonSynthNumberIssue(invalid, key, value, field) {
        if (typeof value !== 'number' || !Number.isFinite(value)) {
          invalid.push({ key: key, reason: '数値が必要' });
          return;
        }
        if (field.integer && Math.round(value) !== value) {
          invalid.push({ key: key, reason: '整数が必要' });
          return;
        }
        if (value < field.min || value > field.max) {
          invalid.push({ key: key, reason: '範囲外' });
        }
      }

      function pushCommonSynthArrayIssues(invalid, key, value, limit) {
        if (!Array.isArray(value)) {
          invalid.push({ key: key, reason: '配列が必要' });
          return;
        }
        if (value.length < limit.minLen || value.length > limit.maxLen) {
          invalid.push({ key: key, reason: '要素数が範囲外' });
        }
        for (let i = 0; i < value.length; i++) {
          const el = value[i];
          if (typeof el !== 'number' || !Number.isFinite(el)) {
            invalid.push({ key: key, reason: '要素' + i + 'が不正' });
          } else if (el < limit.min || el > limit.max) {
            invalid.push({ key: key, reason: '要素' + i + 'が範囲外' });
          }
        }
      }

      function validateCommonSynthParams(input) {
        const missing = [];
        const invalid = [];
        const src = commonSynthPlainObject(input);
        if (!src) {
          for (let i = 0; i < COMMON_SYNTH_KEYS.length; i++) missing.push(COMMON_SYNTH_KEYS[i]);
          return { complete: false, missing: missing, invalid: invalid };
        }
        for (let i = 0; i < COMMON_SYNTH_KEYS.length; i++) {
          if (!Object.prototype.hasOwnProperty.call(src, COMMON_SYNTH_KEYS[i])) missing.push(COMMON_SYNTH_KEYS[i]);
        }
        if (Object.prototype.hasOwnProperty.call(src, 'name')) {
          if (typeof src.name !== 'string' || src.name.length === 0) {
            invalid.push({ key: 'name', reason: '空でない文字列が必要' });
          }
        }
        for (let i = 0; i < COMMON_SYNTH_ENUM_FIELDS.length; i++) {
          const field = COMMON_SYNTH_ENUM_FIELDS[i];
          if (!Object.prototype.hasOwnProperty.call(src, field.key)) continue;
          if (field.allowed.indexOf(src[field.key]) === -1) {
            invalid.push({ key: field.key, reason: '選択肢にない' });
          }
        }
        for (let i = 0; i < COMMON_SYNTH_NUMBER_FIELDS.length; i++) {
          const field = COMMON_SYNTH_NUMBER_FIELDS[i];
          if (!Object.prototype.hasOwnProperty.call(src, field.key)) continue;
          pushCommonSynthNumberIssue(invalid, field.key, src[field.key], field);
        }
        for (let i = 0; i < COMMON_SYNTH_BOOL_FIELDS.length; i++) {
          const key = COMMON_SYNTH_BOOL_FIELDS[i];
          if (!Object.prototype.hasOwnProperty.call(src, key)) continue;
          if (typeof src[key] !== 'boolean') invalid.push({ key: key, reason: '真偽値が必要' });
        }
        if (Object.prototype.hasOwnProperty.call(src, 'sample') && src.sample !== null && typeof src.sample !== 'string') {
          invalid.push({ key: 'sample', reason: '文字列またはnullが必要' });
        }
        if (Object.prototype.hasOwnProperty.call(src, 'fixedFreq') && src.fixedFreq !== null) {
          const freq = src.fixedFreq;
          if (typeof freq !== 'number' || !Number.isFinite(freq)) {
            invalid.push({ key: 'fixedFreq', reason: '数値またはnullが必要' });
          } else if (freq < 20 || freq > 8000) {
            invalid.push({ key: 'fixedFreq', reason: '範囲外' });
          }
        }
        if (Object.prototype.hasOwnProperty.call(src, 'scale')) {
          pushCommonSynthArrayIssues(invalid, 'scale', src.scale, COMMON_SYNTH_ARRAY_FIELDS.scale);
        }
        if (Object.prototype.hasOwnProperty.call(src, 'chord')) {
          pushCommonSynthArrayIssues(invalid, 'chord', src.chord, COMMON_SYNTH_ARRAY_FIELDS.chord);
        }
        return {
          complete: missing.length === 0 && invalid.length === 0,
          missing: missing,
          invalid: invalid
        };
      }

      function registerCommonSynthVoice(id, input) {
        if (typeof id !== 'string' || id.length === 0 || id === '__proto__' || id === 'constructor' || id === 'prototype') {
          return { ok: false, missing: [], invalid: [{ key: 'id', reason: '識別子が不正' }] };
        }
        const report = validateCommonSynthParams(input);
        if (!report.complete) return { ok: false, missing: report.missing, invalid: report.invalid };
        COMMON_SYNTH_VOICES[id] = createCommonSynthParams(input);
        return { ok: true, missing: [], invalid: [] };
      }

      function getCommonSynthVoice(id) {
        if (typeof id !== 'string' || !Object.prototype.hasOwnProperty.call(COMMON_SYNTH_VOICES, id)) return null;
        return createCommonSynthParams(COMMON_SYNTH_VOICES[id]);
      }

      function trackUsesCommonEngine(trackDef) {
        return !!(trackDef && trackDef.engine === 'common');
      }

      (function selfCheckCommonSynthParams() {
        const checkIds = ['step1-selfcheck-ok', 'step1-selfcheck-bad'];
        try {
          const errors = [];
          const expect = (cond, msg) => { if (!cond) errors.push(msg); };
          const near = (actual, expected, msg) => {
            expect(typeof actual === 'number' && Math.abs(actual - expected) < 1e-9, msg + ' actual=' + actual);
          };

          expect(Object.keys(COMMON_SYNTH_VOICES).length === 0, '登録表の初期状態が空');
          expect(Object.prototype.hasOwnProperty.call(COMMON_SYNTH_DEFAULTS, 'outputGain') === false, 'outputGainは初期値に含めない');
          expect(COMMON_SYNTH_KEYS.length === 57, '入力項目数');
          for (let i = 0; i < COMMON_SYNTH_KEYS.length; i++) {
            expect(Object.prototype.hasOwnProperty.call(COMMON_SYNTH_DEFAULTS, COMMON_SYNTH_KEYS[i]), '初期値の欠落 ' + COMMON_SYNTH_KEYS[i]);
          }

          const defaults = createCommonSynthParams({});
          expect(defaults.outputGain === 0.3, '初期状態のoutputGain');
          expect(defaults.scale !== COMMON_SYNTH_DEFAULTS.scale, 'scaleは新しい配列');
          const defaultsScaleLength = defaults.scale.length;
          defaults.scale.push(4);
          expect(defaults.scale.length === defaultsScaleLength + 1, '返したscaleは変更できる');
          expect(COMMON_SYNTH_DEFAULTS.scale.length === 1, '初期scaleは不変');
          expect(defaults.chord !== COMMON_SYNTH_DEFAULTS.chord && defaults.chord.length === 0, 'chordは新しい空配列');
          const defaultsReport = validateCommonSynthParams(defaults);
          expect(defaultsReport.complete === true, '正規化結果は検証を通る');
          expect(defaults.outputGain === 0.3, '検証はoutputGainを変えない');

          const under = createCommonSynthParams({ osc1Level: 0.25, osc2Level: 0, noiseLevel: 0, unison: 1, chord: [], volume: 0.8 });
          expect(under.outputGain === 0.8, '0.3以下ではvolumeを返す');
          const exact = createCommonSynthParams({ osc1Level: 0.5, osc2Level: 0, noiseLevel: 0, unison: 1, chord: [], volume: 0.6 });
          expect(exact.outputGain === 0.6, '0.3ちょうどは下げない');
          const chorded = createCommonSynthParams({ osc1Level: 0.5, osc2Level: 0, noiseLevel: 0, unison: 1, chord: [4, 7], volume: 1 });
          near(chorded.outputGain, 0.2, 'chordは追加音程なので音数はlength+1');
          const doubled = createCommonSynthParams({ osc1Level: 0.5, osc2Level: 0, noiseLevel: 0, unison: 2, chord: [], volume: 1 });
          expect(doubled.outputGain === 0.3, 'unisonを音量見込みに含める');
          const layered = createCommonSynthParams({ osc1Level: 0, osc2Level: 0.25, noiseLevel: 0.25, unison: 1, chord: [], volume: 1 });
          expect(layered.outputGain === 0.6, 'osc2とnoiseを音量見込みに含める');
          const plainFm = createCommonSynthParams({ osc1Level: 0.2, osc2Level: 0, noiseLevel: 0, unison: 1, chord: [], volume: 1, fmEnabled: false, fmIndex: 0, fmLevel: 0 });
          const fullFm = createCommonSynthParams({ osc1Level: 0.2, osc2Level: 0, noiseLevel: 0, unison: 1, chord: [], volume: 1, fmEnabled: true, fmIndex: 12, fmLevel: 1, fmRatio: 16 });
          expect(plainFm.outputGain === fullFm.outputGain, 'FMはoutputGainに影響しない');
          const forced = createCommonSynthParams({ osc1Level: 0.25, osc2Level: 0, noiseLevel: 0, unison: 1, chord: [], volume: 0.5, outputGain: 99 });
          expect(forced.outputGain === 0.5, '入力のoutputGainは採用しない');
          expect(createCommonSynthParams({ volume: 1 }).volume === 0.8, 'volumeは0.8まで');

          expect(createCommonSynthParams({ fixedFreq: null }).fixedFreq === null, 'fixedFreqのnull');
          expect(createCommonSynthParams({ fixedFreq: 20 }).fixedFreq === 20, 'fixedFreq下限');
          expect(createCommonSynthParams({ fixedFreq: 8000 }).fixedFreq === 8000, 'fixedFreq上限');
          expect(createCommonSynthParams({ fixedFreq: 19 }).fixedFreq === 20, 'fixedFreq下限へ制限');
          expect(createCommonSynthParams({ fixedFreq: 8000.1 }).fixedFreq === 8000, 'fixedFreq上限へ制限');
          expect(createCommonSynthParams({ fixedFreq: '440' }).fixedFreq === null, 'fixedFreqの文字列');
          expect(createCommonSynthParams({ fixedFreq: NaN }).fixedFreq === null, 'fixedFreqのNaN');
          expect(createCommonSynthParams({ fixedFreq: undefined }).fixedFreq === null, 'fixedFreqのundefined');
          const falseFreq = { fixedFreq: false };
          expect(createCommonSynthParams(falseFreq).fixedFreq === null, 'fixedFreqの不正値');
          expect(falseFreq.fixedFreq === false, 'fixedFreqの入力は不変');

          const scale = [10, 99, 'bad'];
          const chord = [3, 'x', 40];
          const copied = createCommonSynthParams({ scale: scale, chord: chord });
          expect(copied.scale !== scale && copied.chord !== chord, '配列の参照が違う');
          expect(scale[0] === 10 && scale[1] === 99 && scale[2] === 'bad', 'scale入力は不変');
          expect(chord[0] === 3 && chord[1] === 'x' && chord[2] === 40, 'chord入力は不変');
          expect(copied.scale[0] === 10 && copied.scale[1] === 72 && copied.scale[2] === 0, 'scale要素の制限と置換');
          expect(copied.chord[0] === 3 && copied.chord[1] === 0 && copied.chord[2] === 36, 'chord要素の制限と置換');
          scale.push(9);
          expect(copied.scale.length === 3, '返したscaleは入力のpushを受けない');

          const longScale = [];
          for (let i = 0; i < 40; i++) longScale.push(i);
          const longChord = [];
          for (let i = 0; i < 10; i++) longChord.push(1);
          const truncated = createCommonSynthParams({ osc1Level: 0.5, osc2Level: 0, noiseLevel: 0, unison: 1, volume: 1, scale: longScale, chord: longChord });
          expect(longScale.length === 40 && longChord.length === 10, '長い配列の入力は不変');
          expect(truncated.scale.length === 32 && truncated.chord.length === 8, '配列の要素数を制限');
          near(truncated.outputGain, 0.3 / 4.5, '音量見込みは制限後のchord長を使う');
          const emptyScale = createCommonSynthParams({ scale: [] });
          expect(emptyScale.scale.length === 1 && emptyScale.scale[0] === 0, '空のscaleは初期要素');
          expect(createCommonSynthParams({ scale: 'nope' }).scale.join(',') === '0', 'scaleが配列でない場合');
          expect(createCommonSynthParams({ chord: null }).chord.length === 0, 'chordが配列でない場合');

          const sparse = [1];
          sparse.length = 3;
          const sparseOut = createCommonSynthParams({ scale: sparse });
          expect(sparse.length === 3 && sparse[1] === undefined && sparse[2] === undefined, '穴あき配列は不変');
          expect(sparseOut.scale[0] === 1 && sparseOut.scale[1] === 0 && sparseOut.scale[2] === 0, '穴あき要素は初期値');

          const watched = { scale: [0, 'x', 99], chord: [1, 2, 3, 4, 5, 6, 7, 8, 9], fixedFreq: false, name: '' };
          const watchedJson = JSON.stringify(watched);
          const watchedKeys = Object.keys(watched).join(',');
          const watchedReport = validateCommonSynthParams(watched);
          expect(JSON.stringify(watched) === watchedJson, '検証は入力値を変えない');
          expect(Object.keys(watched).join(',') === watchedKeys, '検証は項目を増減しない');
          expect(watched.scale[1] === 'x' && watched.scale[2] === 99, '検証は配列要素を変えない');
          expect(watchedReport.complete === false, '不正な入力は不完全');
          expect(watchedReport.missing.indexOf('volume') !== -1, '欠落項目を報告');
          expect(watchedReport.invalid.length > 0, '不正項目を報告');

          const normalized = createCommonSynthParams({ volume: 5, scale: [100, -100, 'x'], fixedFreq: 3, chord: [99] });
          expect(normalized.volume === 0.8 && normalized.fixedFreq === 20, '数値の範囲制限');
          expect(normalized.scale[0] === 72 && normalized.scale[1] === -72 && normalized.scale[2] === 0, 'scaleの正規化');
          expect(normalized.chord[0] === 36, 'chordの正規化');
          expect(validateCommonSynthParams(normalized).complete === true, '正規化後は全項目が有効');
          const saved = registerCommonSynthVoice('step1-selfcheck-ok', normalized);
          expect(saved.ok === true, '全項目がある定義は登録できる');
          normalized.scale[0] = 1;
          normalized.volume = 0.1;
          const loaded = getCommonSynthVoice('step1-selfcheck-ok');
          expect(loaded.scale[0] === 72 && loaded.volume === 0.8, '登録値は入力の変更を受けない');
          loaded.scale[0] = 5;
          expect(getCommonSynthVoice('step1-selfcheck-ok').scale[0] === 72, '取得結果は登録値を変えない');

          const partial = createCommonSynthParams({});
          delete partial.outputGain;
          delete partial.pan;
          const denied = registerCommonSynthVoice('step1-selfcheck-bad', partial);
          expect(denied.ok === false && denied.missing.indexOf('pan') !== -1, '欠落がある定義は登録しない');
          expect(getCommonSynthVoice('step1-selfcheck-bad') === null, '拒否した定義は残らない');
          const over = createCommonSynthParams({});
          delete over.outputGain;
          over.volume = 2;
          expect(registerCommonSynthVoice('step1-selfcheck-bad', over).ok === false, '範囲外は登録しない');

          const legacyTrack = { name: '909 KICK', mode: 'synth', synthType: 'kick' };
          expect(trackUsesCommonEngine(legacyTrack) === false, '既存トラックは共通エンジンではない');
          expect(legacyTrack.engine === undefined, '判定はトラック定義を変えない');
          expect(trackUsesCommonEngine({ engine: 'common' }) === true, 'engine指定だけを見る');
          expect(trackUsesCommonEngine(null) === false && trackUsesCommonEngine(undefined) === false, '空の判定');

          if (errors.length > 0) console.error('共通シンセパラメーター検査に失敗:', errors);
        } catch (err) {
          console.error('共通シンセパラメーター検査に失敗:', err);
        } finally {
          for (let i = 0; i < checkIds.length; i++) delete COMMON_SYNTH_VOICES[checkIds[i]];
        }
      })();

      // =========================================================================
      // 2. MODULAR AUDIO ENGINE & CUSTOM SYNTH ENGINES
      // =========================================================================
      // ★ 独自Web Audioシンセエンジンを関数として登録可能 (アプローチB)

        // =========================================================================
      // ★ PATCH 共通シンセ：全パラメーターの一覧（書き忘れた項目は、この値で動きます）
      // =========================================================================
      const PATCH_TEMPLATE = {
        // ① 基本
        volume: 0.5,            // 音量（0〜1）
        pan: 0,                 // 左右の位置（-1〜1）
        mono: false,            // true：次のタイミングの音が始まったら、前のタイミングの音を止める（同じタイミングの音は一緒に鳴る＝和音OK）
        monoFade: 0.02,         // monoの時、前の音が消えるまでの時間（秒）
        speed: 1,               // 円盤の回転速度（0.25 = 4小節で1周）
        // ② 音源
        osc1Wave: 'sawtooth',   // メインの波形（'sawtooth' 'square' 'triangle' 'sine' 'none'）
        osc1Level: 1,           // メインの音量
        osc1Octave: 0,          // メインのオクターブ（-1で1オクターブ下）
        osc1Detune: 0,          // メインのずれ（セント）
        osc2Wave: 'none',       // 2本目の波形（'none'で無効。FMはかからない）
        osc2Level: 1,
        osc2Octave: 0,
        osc2Detune: 0,
        noiseLevel: 0,          // ノイズの音量
        unison: 1,              // 同じ音を重ねる本数（スーパーソー）
        unisonDetune: 0,        // 重ねた音のずれ（セント）
        unisonSpread: 0,        // 重ねた音の左右の広がり（0〜1）
        octaveOffset: 0,        // 全体の高さ（半音。-12で1オクターブ下）
        // ③ ピッチの動き
        fixedFreq: 0,           // 0以外：音階を無視して、この周波数（Hz）に固定
        glide: 0,               // 前の音からのスライド時間（秒）
        pitchStart: 0,          // 音の始めのずれ（半音。マイナスは下から）
        pitchStartTime: 0,      // そのずれが戻るまでの時間（秒）
        pitchEnd: 0,            // 音の終わりのずれ（半音。マイナスは落ちる）
        pitchEndTime: 0,        // 終わりに向かって動く時間（秒）
        fade: 0,                // 0以外：音量の立ち上がり・消え際、ピッチの始め・終わりを同じ秒数にする
        // ④ FM変調（メイン osc1 にかかる）
        fmRatio: 0,             // モジュレーター周波数 ÷ メイン周波数。0でFMなし
        fmWave: 'sine',         // モジュレーターの波形
        fmDepth: 0,             // 音の始めの深さ（0〜10。大きいほど金属的）
        fmDepthEnd: 0,          // 深さが落ち着いた先の値
        fmDecay: 1,             // 深さが変わる時間（音の長さに対する割合 0〜1）
        fmCutoffLink: 0,        // 0〜1：CUTOFFノブでFMの深さも変える度合い
        // ⑤ LFO（ゆらぎ）
        lfoTarget: 'none',      // 'none' 'pitch'（セント）'filter'（Hz）'amp'（0〜1）
        lfoWave: 'sine',
        lfoRate: 5,             // 速さ（Hz）
        lfoDepth: 0,            // 深さ（lfoTargetごとに単位が変わる）
        // ⑥ フィルター
        filterType: 'lowpass',  // 'lowpass' 'highpass' 'bandpass' 'notch' 'none'
        cutoff: 1000,           // 基準の周波数（Hz）
        cutoffRange: 4000,      // CUTOFFノブで足される幅（Hz）
        radiusCutoff: 0,        // 円盤の外側ほど明るくする量（Hz）
        q: 1,                   // レゾナンスの基本値
        qRange: 10,             // RESOノブで足される幅
        filterEnv: true,        // false：フィルターを動かさず固定
        filterEnvDrop: 0.25,    // 終わりの閉じ具合（基準に対する割合。1で動かさない）
        filterEnvTime: 0.85,    // 閉じ終わる位置（音の長さに対する割合）
        filterMin: 60,          // 閉じた時の下限（Hz）
        // ⑦ 音量の形・長さ
        attack: 0.006,          // 立ち上がり（秒）
        decayTime: 0,           // ピークからサステインまで下がる時間（秒）。0 = 音の長さいっぱい
        sustain: 0,             // 保つ音量（0〜1）
        release: 0.05,          // 消えるまでの時間（秒）
        lengthScale: 3.5,       // 長さ（ステップ）= DECAYノブ × この値
        lengthMin: 0.5,         // 最短の長さ（ステップ）
        lengthSteps: 0,         // 0以外：DECAYノブに関係なく、この長さ（ステップ）に固定（16 = 4拍）
        // ⑧ 歪み
        drive: 0,               // 最初からかける歪み（0〜0.95）
        driveRange: 1           // DRIVEノブで足される量
      };
      const SYNTH_ENGINES = {
        // ★ 昔のテクノ「WEIRD」エンジン完全復活 (LFO FM変調・ピッチスウィープFX)
        weird: (engine, tIdx, time, radius, noteVal, p, def) => {
          const ctx = engine.ctx;
          const dur = 0.08 + p.decay * 0.45;
          const baseFreq = 180 + radius * 1100;

          const osc = ctx.createOscillator();
          const lfo = ctx.createOscillator();
          const lfoGain = ctx.createGain();
          const gain = ctx.createGain();

          // CUTOFFノブで波形変化 ('sine' -> 'square' -> 'sawtooth' -> 'triangle')
          const waves = ['sine', 'square', 'sawtooth', 'triangle'];
          osc.type = waves[Math.min(3, Math.floor(p.cutoff * 4))];
          osc.frequency.setValueAtTime(baseFreq, time);
          osc.frequency.exponentialRampToValueAtTime(Math.max(50, baseFreq * (0.4 + p.reso)), time + dur);

          // 高速LFOによる金属・モジュレーション変調
          lfo.type = 'sine';
          lfo.frequency.value = 12 + p.reso * 50;
          lfoGain.gain.value = 80 + radius * 350;
          lfo.connect(lfoGain);
          lfoGain.connect(osc.frequency);

          gain.gain.setValueAtTime(0.4, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + dur);

          let node = osc;
          if (p.drive > 0.05) {
            const shaper = ctx.createWaveShaper();
            shaper.curve = engine.makeDistortionCurve(p.drive * 0.8);
            osc.connect(shaper);
            node = shaper;
          }

          node.connect(gain);
          gain.connect(engine.masterGain);

          osc.start(time);
          lfo.start(time);
          osc.stop(time + dur + 0.02);
          lfo.stop(time + dur + 0.02);
        },

         // ★ KAWAII FUTURE BASS コード・スーパーソー
        // 始めに下からしゃくり上げ、終わりにピッチが落ちる
        fb_chord: (engine, tIdx, time, radius, noteVal, p, def) => {
          const ctx = engine.ctx;
          const stepDur = (60 / bpm) / 4;
          const dur = Math.max(stepDur * 0.5, p.decay * stepDur * (def.decayScale || 4.0));
          const chord = def.chord || [0, 4, 7, 11];
          const detunes = def.detunes || [-14, 0, 14];
          const pans = [-0.7, 0, 0.7];
          const inSemi = def.pitchIn !== undefined ? def.pitchIn : 2;
          const outSemi = def.pitchOut !== undefined ? def.pitchOut : 3;
          const oct = def.octaveOffset || 0;
          // ★ fade：立ち上がりと鳴り終わり（音量・ピッチ）に同じ時間をかける
          const fade = Math.min(def.fade !== undefined ? def.fade : 0.1, dur * 0.45);

          const mix = ctx.createGain();
          mix.gain.value = (def.volume || 0.5) / Math.sqrt(chord.length * detunes.length) * 0.6;

          const filter = ctx.createBiquadFilter();
          filter.type = 'lowpass';
          const cutoff = 1200 + p.cutoff * 9000;
          filter.frequency.setValueAtTime(cutoff, time);
          if (def.filterEnv !== false) {
            filter.frequency.exponentialRampToValueAtTime(Math.max(400, cutoff * (def.filterEnvDrop || 0.5)), time + dur);
          }
          filter.Q.value = 0.7 + p.reso * 5;

          const gain = ctx.createGain();
          engine.applyEnvelope(gain.gain, time, dur, 1, Object.assign({}, def, { attack: fade, release: fade }));

          mix.connect(filter);
          let last = filter;
          if (p.drive > 0.05) {
            const shaper = ctx.createWaveShaper();
            shaper.curve = engine.makeDistortionCurve(p.drive * 0.6);
            filter.connect(shaper);
            last = shaper;
          }
          last.connect(gain);
          gain.connect(engine.masterGain);

          const stopTime = time + dur + 0.03;
          for (const iv of chord) {
            const freq = 440 * Math.pow(2, (noteVal + iv + oct - 9) / 12);
            const fIn = freq * Math.pow(2, -inSemi / 12);
            const fOut = freq * Math.pow(2, -outSemi / 12);
            detunes.forEach((det, i) => {
              const osc = ctx.createOscillator();
              osc.type = 'sawtooth';
              osc.detune.setValueAtTime(det, time);
              osc.frequency.setValueAtTime(fIn, time);
              osc.frequency.exponentialRampToValueAtTime(freq, time + fade);
              osc.frequency.setValueAtTime(freq, time + dur - fade);
              osc.frequency.exponentialRampToValueAtTime(fOut, time + dur);
              const pan = ctx.createStereoPanner();
              pan.pan.value = pans[i % pans.length];
              osc.connect(pan);
              pan.connect(mix);
              osc.start(time);
              osc.stop(stopTime);
            });
          }
        },
        // 例：FMベル・金属音エンジン
        fm_bell: (engine, tIdx, time, radius, semitones, p, def) => {
          const ctx = engine.ctx;
          const oct = def.octaveOffset || 12;
          const freq = 440 * Math.pow(2, (semitones + oct - 9) / 12);
          const stepDur = (60 / bpm) / 4;
          const dur = Math.max(0.1, p.decay * stepDur * 5.0);

          const carrier = ctx.createOscillator();
          carrier.type = 'sine';
          carrier.frequency.setValueAtTime(freq, time);

          const modulator = ctx.createOscillator();
          modulator.type = 'sine';
          modulator.frequency.setValueAtTime(freq * (def.fmRatio || 3.5), time);

          const modGain = ctx.createGain();
          const modDepth = (def.fmDepth || 600) * (0.3 + p.cutoff * 1.5);
          modGain.gain.setValueAtTime(modDepth, time);
          modGain.gain.exponentialRampToValueAtTime(1, time + dur * 0.7);

          modulator.connect(modGain);
          modGain.connect(carrier.frequency);

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.001, time);
          gain.gain.linearRampToValueAtTime(0.6, time + 0.004);
          gain.gain.exponentialRampToValueAtTime(0.001, time + dur);

          carrier.connect(gain);
          gain.connect(engine.masterGain);

          carrier.start(time);
          modulator.start(time);
          carrier.stop(time + dur + 0.02);
          modulator.stop(time + dur + 0.02);
        }
      };

      class ModularSoundEngine {
        constructor() {
          this.ctx = null;
          this.masterGain = null;
          this.prevFreqs = [110, 110, 110, 110, 110];
          this.trackActiveVoices = Array.from({ length: 5 }, () => ({ batchTime: -1, nodes: [] }));
          this.sampleBuffers = { mallet: null, kalimba: null };
        }

        ensureContext() {
          try {
            if (!this.ctx) {
              const AudioCtx = window.AudioContext || window.webkitAudioContext;
              this.ctx = new AudioCtx();
              this.masterGain = this.ctx.createGain();
              this.masterGain.gain.value = 0.85;
              this.masterGain.connect(this.ctx.destination);
              this.generateDefaultSamples();
            }
            if (this.ctx.state === 'suspended') {
              this.ctx.resume();
            }
          } catch (_) {}
        }

        generateDefaultSamples() {
          const sr = this.ctx.sampleRate;
          // 1. 鉄琴 (Mallet / Glockenspiel)
          const mLen = sr * 1.4;
          const mBuf = this.ctx.createBuffer(1, mLen, sr);
          const mData = mBuf.getChannelData(0);
          for (let i = 0; i < mLen; i++) {
            const t = i / sr;
            const env = Math.exp(-t * 6.5);
            mData[i] = (Math.sin(2 * Math.PI * 523.25 * t) * 0.6 +
                        Math.sin(2 * Math.PI * 523.25 * 2.76 * t) * 0.25 +
                        Math.sin(2 * Math.PI * 523.25 * 5.4 * t) * 0.15) * env;
          }
          this.sampleBuffers.mallet = mBuf;

          // 2. カリンバ (Kalimba / Organics)
          const kLen = sr * 1.8;
          const kBuf = this.ctx.createBuffer(1, kLen, sr);
          const kData = kBuf.getChannelData(0);
          for (let i = 0; i < kLen; i++) {
            const t = i / sr;
            const env = Math.exp(-t * 4.5);
            kData[i] = (Math.sin(2 * Math.PI * 392 * t) * 0.7 +
                        Math.sin(2 * Math.PI * 392 * 3.0 * t) * 0.2 +
                        Math.sin(2 * Math.PI * 392 * 6.0 * t) * 0.1) * env;
          }
          this.sampleBuffers.kalimba = kBuf;
        }

        makeDistortionCurve(amount) {
          const k = amount * 180;
          const nSamples = 256;
          const curve = new Float32Array(nSamples);
          for (let i = 0; i < nSamples; i++) {
            const x = (i * 2) / nSamples - 1;
            curve[i] = k === 0 ? x : ((3 + k) * x * 20 * (Math.PI / 180)) / (Math.PI + k * Math.abs(x));
          }
          return curve;
        }

        handleVoiceStealing(tIdx, time) {
          const voiceState = this.trackActiveVoices[tIdx];
          if (Math.abs(time - voiceState.batchTime) > 0.005) {
            const stopTime = Math.max(this.ctx.currentTime, time);
            for (const v of voiceState.nodes) {
              try {
                v.gain.gain.setValueAtTime(v.gain.gain.value, stopTime);
                v.gain.gain.linearRampToValueAtTime(0.0001, stopTime + 0.006);
                v.src.stop(stopTime + 0.008);
              } catch (_) {}
            }
            voiceState.nodes = [];
            voiceState.batchTime = time;
          }
        }

        triggerTrack(tIdx, time, radius, clip) {
          if (!this.ctx) return;
          const def = activeGenre.tracks[tIdx];
          const p = trackParams[tIdx];

          const scale = def.scale;
          const scaleIdx = Math.min(scale.length - 1, Math.floor((1 - radius) * scale.length));
          const noteVal = scale[scaleIdx];

          if (def.mode === 'sampler') {
            let buffer = clip.audioBuffer;
            if (!buffer) {
              if (def.sampleType === 'mallet') buffer = this.sampleBuffers.mallet;
              else if (def.sampleType === 'kalimba') buffer = this.sampleBuffers.kalimba;
            }
            if (!buffer) return;

            this.handleVoiceStealing(tIdx, time);

            const src = this.ctx.createBufferSource();
            src.buffer = buffer;

            if (def.pitched) {
              const rate = Math.pow(2, noteVal / 12);
              src.playbackRate.setValueAtTime(rate, time);
            }

            const filter = this.ctx.createBiquadFilter();
            filter.type = 'lowpass';
            const cutoffFreq = 250 + Math.pow(p.cutoff, 2) * 15000;
            filter.frequency.setValueAtTime(cutoffFreq, time);
            filter.Q.value = p.reso * 10;

            const gainNode = this.ctx.createGain();
            const dur = Math.max(0.1, p.decay * 2.8);
            gainNode.gain.setValueAtTime(0.001, time);
            gainNode.gain.linearRampToValueAtTime(0.85, time + 0.004);
            gainNode.gain.exponentialRampToValueAtTime(0.001, time + dur);

            let lastNode = filter;
            if (p.drive > 0.05) {
              const shaper = this.ctx.createWaveShaper();
              shaper.curve = this.makeDistortionCurve(p.drive * 0.7);
              filter.connect(shaper);
              lastNode = shaper;
            }

            src.connect(filter);
            lastNode.connect(gainNode);
            gainNode.connect(this.masterGain);

            src.start(time);
            src.stop(time + dur + 0.02);
            this.trackActiveVoices[tIdx].nodes.push({ src, gain: gainNode });

          } else {
            // シンセモード
            if (def.synthType === 'kick') {
              this.triggerKickSynth(time, radius, p);
            } else if (def.synthType === 'hihat') {
              this.triggerHiHatSynth(time, radius, p);
            } else if (def.synthType === 'acid') {
              this.triggerAcid303(tIdx, time, radius, noteVal, p, def);
               } else if (def.synthType === 'patch') {
              this.triggerPatch(tIdx, time, radius, noteVal, p, def);
            } else if (SYNTH_ENGINES[def.synthType]) {
              // 登録された独自シンセエンジン
              SYNTH_ENGINES[def.synthType](this, tIdx, time, radius, noteVal, p, def);
            } else {
              // 汎用メロディックシンセ（defで詳細カスタム可能）
              this.triggerMelodicSynth(tIdx, time, radius, noteVal, def.synthType, p, def);
            }
          }
        }

        triggerKickSynth(time, radius, p) {
          const isDigi = currentGenreKey === 'digicore';
          const dur = 0.12 + p.decay * (isDigi ? 0.7 : 0.45);
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime((85 + p.cutoff * 110) * (0.8 + radius * 0.5), time);
          osc.frequency.exponentialRampToValueAtTime(isDigi ? 35 : 28, time + dur * 0.75);

          gain.gain.setValueAtTime(0.001, time);
          gain.gain.linearRampToValueAtTime(0.95, time + 0.006);
          gain.gain.exponentialRampToValueAtTime(0.001, time + dur);

          let node = osc;
          if (p.drive > 0.05 || isDigi) {
            const shaper = this.ctx.createWaveShaper();
            shaper.curve = this.makeDistortionCurve(Math.max(p.drive, isDigi ? 0.45 : 0.1) * 0.85);
            osc.connect(shaper);
            node = shaper;
          }
          node.connect(gain);
          gain.connect(this.masterGain);
          osc.start(time);
          osc.stop(time + dur + 0.02);
        }

        triggerHiHatSynth(time, radius, p) {
          const dur = 0.02 + p.decay * 0.25;
          const buf = this.ctx.createBuffer(1, Math.max(1, Math.floor(this.ctx.sampleRate * dur)), this.ctx.sampleRate);
          const data = buf.getChannelData(0);
          for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;

          const src = this.ctx.createBufferSource();
          src.buffer = buf;
          const hp = this.ctx.createBiquadFilter();
          hp.type = (currentGenreKey === 'botanica') ? 'bandpass' : 'highpass';
          hp.frequency.value = 2500 + p.cutoff * 6000 + radius * 3000;

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.5 + p.drive * 0.4, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + dur);

          src.connect(hp);
          hp.connect(gain);
          gain.connect(this.masterGain);
          src.start(time);
          src.stop(time + dur + 0.01);
        }

        triggerAcid303(tIdx, time, radius, freq, p) {
          const stepDur = (60 / bpm) / 4;
          const dur = stepDur * (2.0 + p.decay * 10.0);

          // 前の音を止める（モノフォニック化。これでグライドが聞こえる）
          if (this.acidVoice) {
            try {
              this.acidVoice.choke.gain.setTargetAtTime(0, time, 0.004);
              this.acidVoice.osc.stop(time + 0.04);
            } catch (_) {}
          }

          const osc = this.ctx.createOscillator();
          osc.type = 'sawtooth';
          const prevFreq = this.prevFreqs[tIdx] || 110;
          const glide = Math.min(0.09, stepDur * 0.7);
          osc.frequency.setValueAtTime(prevFreq, time);
          osc.frequency.exponentialRampToValueAtTime(freq, time + glide);
          this.prevFreqs[tIdx] = freq;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          const baseCutoff = 160 + p.cutoff * 3800;
          filter.frequency.setValueAtTime(Math.min(12000, baseCutoff + radius * 1600), time);
          filter.frequency.exponentialRampToValueAtTime(Math.max(110, baseCutoff * 0.35), time + dur * 0.85);
          filter.Q.value = 2 + p.reso * 18;

          const shaper = this.ctx.createWaveShaper();
          shaper.curve = this.makeDistortionCurve(Math.max(0.1, p.drive * 0.85));

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.001, time);
          gain.gain.linearRampToValueAtTime(0.45, time + 0.008);
          gain.gain.exponentialRampToValueAtTime(0.001, time + dur * 0.95);

          const choke = this.ctx.createGain();
          choke.gain.setValueAtTime(1, time);

          osc.connect(filter);
          filter.connect(shaper);
          shaper.connect(gain);
          gain.connect(choke);
          choke.connect(this.masterGain);

          osc.start(time);
          osc.stop(time + dur + 0.02);
          this.acidVoice = { osc, choke };
        }
        triggerMelodicSynth(tIdx, time, radius, semitones, waveType, p, def = {}) {
          const oct = def.octaveOffset || 0;
          const freq = 440 * Math.pow(2, (semitones + oct - 9) / 12);
          const stepDur = (60 / bpm) / 4;
          const decayMult = def.decayScale !== undefined ? def.decayScale : 3.5;
          const dur = Math.max(stepDur * 0.5, p.decay * stepDur * decayMult);

          // 1. メインオシレーター
          const osc1 = this.ctx.createOscillator();
          osc1.type = def.osc1Type || waveType || 'sawtooth';
          const glideTime = def.glide !== undefined ? def.glide : Math.min(0.04, stepDur * 0.4);
          osc1.frequency.setValueAtTime(this.prevFreqs[tIdx] || freq, time);
          osc1.frequency.exponentialRampToValueAtTime(freq, time + glideTime);
          this.prevFreqs[tIdx] = freq;

          // オシレーターミックス
          let soundSource = osc1;
          let osc2 = null;

          // 2. サブ/デュアルオシレーター (def.detune または def.osc2Type がある場合)
          if (def.detune || def.osc2Type) {
            osc2 = this.ctx.createOscillator();
            osc2.type = def.osc2Type || osc1.type;
            const det = def.detune || 0;
            const osc2Freq = freq * Math.pow(2, (def.osc2Octave || 0));
            osc2.frequency.setValueAtTime((this.prevFreqs[tIdx] || freq) * Math.pow(2, (def.osc2Octave || 0)), time);
            osc2.frequency.exponentialRampToValueAtTime(osc2Freq, time + glideTime);
            osc2.detune.setValueAtTime(det, time);

            const oscMix = this.ctx.createGain();
            oscMix.gain.value = 0.5;
            osc1.connect(oscMix);
            osc2.connect(oscMix);
            soundSource = oscMix;
          }

          // 3. フィルター (filterType, cutoffEnv, reso)
          const filter = this.ctx.createBiquadFilter();
          filter.type = def.filterType || 'lowpass';
          const baseCutoff = def.baseCutoff !== undefined
            ? def.baseCutoff + p.cutoff * (def.cutoffRange || 5000)
            : 160 + Math.pow(p.cutoff, 2) * 14000;
          
          const startCutoff = baseCutoff + radius * (def.radiusCutoff || 1500);
          filter.frequency.setValueAtTime(startCutoff, time);

          // ★ filterEnv: false の場合はフィルターを動かさず固定（ピコピコ・オルガン等に最適）
          if (def.filterEnv !== false) {
            filter.frequency.exponentialRampToValueAtTime(Math.max(60, baseCutoff * (def.filterEnvDrop || 0.25)), time + dur * 0.85);
          }
          filter.Q.value = (def.baseQ || 2) + p.reso * (def.resoRange || 18);

          // 4. アンプエンベロープ
          const gain = this.ctx.createGain();
          this.applyEnvelope(gain.gain, time, dur, def.volume || 0.65, def);

          // 5. ディストーション / オーバードライブ
          const driveAmount = p.drive + (def.driveBase || 0);
          soundSource.connect(filter);

          let finalNode = filter;
          if (driveAmount > 0.05) {
            const shaper = this.ctx.createWaveShaper();
            shaper.curve = this.makeDistortionCurve(Math.min(0.95, driveAmount * 0.85));
            filter.connect(shaper);
            finalNode = shaper;
          }

          finalNode.connect(gain);
          gain.connect(this.masterGain);

          osc1.start(time);
          osc1.stop(time + dur + 0.03);
          if (osc2) {
            osc2.start(time);
            osc2.stop(time + dur + 0.03);
          }
        }

        // ★ アンプエンベロープ共通処理（sustain 指定なしなら従来どおり）
        applyEnvelope(param, time, dur, peak, def) {
          const attack = def.attack !== undefined ? def.attack : 0.006;
          param.setValueAtTime(0.001, time);
          param.linearRampToValueAtTime(peak, time + attack);
          if (def.sustain === undefined) {
            param.exponentialRampToValueAtTime(0.001, time + dur);
            return;
          }
          const sus = Math.max(0.001, peak * def.sustain);
          const release = Math.min(def.release !== undefined ? def.release : 0.08, dur * 0.5);
          const dt = def.decayTime !== undefined ? def.decayTime : 0.12;
          const decayEnd = Math.max(time + attack + 0.002, Math.min(time + attack + dt, time + dur - release));
          const relStart = Math.max(time + dur - release, decayEnd);
          param.exponentialRampToValueAtTime(sus, decayEnd);
          param.setValueAtTime(sus, relStart);
          param.exponentialRampToValueAtTime(0.001, Math.max(time + dur, relStart + 0.01));
        }

         // =====================================================================
        // ★ PATCH 共通シンセ（synthType: 'patch'）
        //   音源 → mix → フィルター → 歪み → トレモロ → 音量 → パン → master
        // =====================================================================
        // =====================================================================
        // ★ PATCH 共通シンセ（synthType: 'patch'）
        //   音源 → mix → フィルター → 歪み → トレモロ → 音量 → パン → master
        // =====================================================================
        triggerPatch(tIdx, time, radius, noteVal, p, def) {
          const ctx = this.ctx;
          const d = Object.assign({}, PATCH_TEMPLATE, def);
          const stepDur = (60 / bpm) / 4;
          const dur = d.lengthSteps > 0
            ? stepDur * d.lengthSteps
            : Math.max(stepDur * d.lengthMin, p.decay * stepDur * d.lengthScale);
          const stopTime = time + dur + 0.03;
          if (!this.monoVoices) this.monoVoices = [];
 
          // fade：音量とピッチの「立ち上がり」と「消え際」を同じ時間にする
          const fade = d.fade > 0 ? Math.min(d.fade, dur * 0.45) : 0;
          const attack = fade > 0 ? fade : d.attack;
          const release = fade > 0 ? fade : d.release;
          const rampIn = fade > 0 ? fade : Math.max(d.glide, d.pitchStartTime);
          const rampOut = fade > 0 ? fade : d.pitchEndTime;
 
          // --- 音程 ---
          const rootFreq = d.fixedFreq > 0
            ? d.fixedFreq
            : 440 * Math.pow(2, (noteVal + d.octaveOffset - 9) / 12);
          const prev = this.prevFreqs[tIdx] || rootFreq;
          this.prevFreqs[tIdx] = rootFreq;
          const startMult = (d.glide > 0 ? prev / rootFreq : 1) * Math.pow(2, d.pitchStart / 12);
          const hasStart = rampIn > 0 && Math.abs(startMult - 1) > 1e-6;
          const hasEnd = rampOut > 0 && Math.abs(d.pitchEnd) > 1e-6;
          const tIn = Math.min(rampIn, dur * 0.9);
          const tOut = Math.min(rampOut, dur * 0.9);
          const endMult = Math.pow(2, d.pitchEnd / 12);
          const schedPitch = (param, f) => {
            if (hasStart) {
              param.setValueAtTime(Math.max(1, f * startMult), time);
              param.exponentialRampToValueAtTime(f, time + tIn);
            } else {
              param.setValueAtTime(f, time);
            }
            if (hasEnd) {
              const t0 = Math.max(time + (hasStart ? tIn : 0), time + dur - tOut);
              param.setValueAtTime(f, t0);
              param.exponentialRampToValueAtTime(Math.max(1, f * endMult), time + dur);
            }
          };
 
          // --- 回路（後ろから順につなぐ） ---
          const mix = ctx.createGain();
          const chain = [mix];
 
          let filter = null;
          if (d.filterType !== 'none') {
            filter = ctx.createBiquadFilter();
            filter.type = d.filterType;
            const baseCut = d.cutoff + p.cutoff * d.cutoffRange;
            filter.frequency.setValueAtTime(baseCut + radius * d.radiusCutoff, time);
            if (d.filterEnv) {
              filter.frequency.exponentialRampToValueAtTime(
                Math.max(Math.max(1, d.filterMin), baseCut * d.filterEnvDrop), time + dur * d.filterEnvTime);
            }
            filter.Q.value = d.q + p.reso * d.qRange;
            chain.push(filter);
          }
 
          const driveAmt = d.drive + p.drive * d.driveRange;
          if (driveAmt > 0.05) {
            const shaper = ctx.createWaveShaper();
            shaper.curve = this.makeDistortionCurve(Math.min(0.95, driveAmt * 0.85));
            chain.push(shaper);
          }
 
          // LFO
          const useLfo = d.lfoTarget !== 'none' && d.lfoDepth !== 0;
          let lfoGain = null;
          if (useLfo) {
            const lfo = ctx.createOscillator();
            lfo.type = d.lfoWave;
            lfo.frequency.value = d.lfoRate;
            lfoGain = ctx.createGain();
            lfo.connect(lfoGain);
            if (d.lfoTarget === 'filter' && filter) {
              lfoGain.gain.value = d.lfoDepth;
              lfoGain.connect(filter.frequency);
            } else if (d.lfoTarget === 'amp') {
              const trem = ctx.createGain();
              trem.gain.value = 1 - d.lfoDepth / 2;
              lfoGain.gain.value = d.lfoDepth / 2;
              lfoGain.connect(trem.gain);
              chain.push(trem);
            } else if (d.lfoTarget === 'pitch') {
              lfoGain.gain.value = d.lfoDepth;
            }
            lfo.start(time);
            lfo.stop(stopTime);
          }
 
          const env = ctx.createGain();
          this.patchEnv(env.gain, time, dur, d.volume, d, attack, release);
          chain.push(env);
 
          if (d.pan !== 0) {
            const panner = ctx.createStereoPanner();
            panner.pan.value = d.pan;
            chain.push(panner);
          }
 
          let choke = null;
          if (d.mono) {
            choke = ctx.createGain();
            choke.gain.setValueAtTime(1, time);
            chain.push(choke);
          }
 
          for (let i = 0; i < chain.length - 1; i++) chain[i].connect(chain[i + 1]);
          chain[chain.length - 1].connect(this.masterGain);
 
          // --- 音源 ---
          const layers = [];
          if (d.osc1Wave !== 'none') layers.push({ wave: d.osc1Wave, level: d.osc1Level, oct: d.osc1Octave, det: d.osc1Detune, fm: true });
          if (d.osc2Wave !== 'none') layers.push({ wave: d.osc2Wave, level: d.osc2Level, oct: d.osc2Octave, det: d.osc2Detune, fm: false });
 
          const nUni = Math.max(1, Math.floor(d.unison));
          const norm = 1 / Math.sqrt(nUni);
          const sources = [];
 
          const noteFreq = rootFreq;
          for (const L of layers) {
            const carrierFreq = noteFreq * Math.pow(2, L.oct);
 
            // FM：モジュレーターの音で、メインの周波数を揺らす
            let modGain = null;
            if (L.fm && d.fmRatio > 0 && (d.fmDepth > 0 || d.fmDepthEnd > 0)) {
              const modFreq = carrierFreq * d.fmRatio;
              const link = d.fmCutoffLink;
              const knobScale = (1 - link) + link * (0.3 + 1.5 * p.cutoff);
              const mod = ctx.createOscillator();
              mod.type = d.fmWave;
              schedPitch(mod.frequency, modFreq);
              modGain = ctx.createGain();
              modGain.gain.setValueAtTime(Math.max(0.0001, d.fmDepth * modFreq * knobScale), time);
              modGain.gain.exponentialRampToValueAtTime(
                Math.max(0.0001, d.fmDepthEnd * modFreq * knobScale), time + Math.max(0.005, dur * d.fmDecay));
              mod.connect(modGain);
              mod.start(time);
              mod.stop(stopTime);
            }
 
            for (let u = 0; u < nUni; u++) {
              const off = nUni > 1 ? (u / (nUni - 1)) * 2 - 1 : 0;   // -1〜+1
              const osc = ctx.createOscillator();
              osc.type = L.wave;
              schedPitch(osc.frequency, carrierFreq);
              osc.detune.setValueAtTime(L.det + off * d.unisonDetune, time);
              if (modGain) modGain.connect(osc.frequency);
              if (useLfo && d.lfoTarget === 'pitch') lfoGain.connect(osc.detune);
 
              const vg = ctx.createGain();
              vg.gain.value = L.level * norm;
              osc.connect(vg);
              if (nUni > 1 && d.unisonSpread > 0) {
                const pn = ctx.createStereoPanner();
                pn.pan.value = off * d.unisonSpread;
                vg.connect(pn);
                pn.connect(mix);
              } else {
                vg.connect(mix);
              }
              osc.start(time);
              osc.stop(stopTime);
              sources.push(osc);
            }
          }
 
          // ノイズ
          if (d.noiseLevel > 0) {
            if (!this.noiseBuf) {
              const len = ctx.sampleRate;
              this.noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
              const nd = this.noiseBuf.getChannelData(0);
              for (let i = 0; i < len; i++) nd[i] = Math.random() * 2 - 1;
            }
            const ns = ctx.createBufferSource();
            ns.buffer = this.noiseBuf;
            ns.loop = true;
            const ng = ctx.createGain();
            ng.gain.value = d.noiseLevel;
            ns.connect(ng);
            ng.connect(mix);
            ns.start(time, Math.random() * 0.5);
            ns.stop(stopTime);
            sources.push(ns);
          }
 
          // mono：新しいタイミングの音が始まったら、前のタイミングの音を止める
          //（同じタイミングの音は一緒に鳴るので、和音が作れる）
          if (d.mono) {
            let mv = this.monoVoices[tIdx];
            if (!mv || Math.abs(time - mv.batchTime) > 0.005) {
              if (mv) {
                for (const v of mv.voices) {
                  try {
                    v.choke.gain.setTargetAtTime(0, time, Math.max(0.002, d.monoFade / 4));
                    for (const o of v.sources) o.stop(time + d.monoFade * 1.5 + 0.02);
                  } catch (_) {}
                }
              }
              mv = { batchTime: time, voices: [] };
              this.monoVoices[tIdx] = mv;
            }
            mv.voices.push({ choke, sources });
          }
        }
 
        // PATCH用の音量の形：立ち上がり → 下がる → サステイン → 消える
        patchEnv(param, time, dur, peak, d, attack, release) {
          const sus = Math.max(0.001, peak * d.sustain);
          const rel = Math.min(release, dur * 0.5);
          param.setValueAtTime(0.001, time);
          param.linearRampToValueAtTime(peak, time + attack);
