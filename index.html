<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Tri-Genre Sound Matrix: Techno / DnB / SynthWave</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: var(--c-bg, #000000); font-family: 'Inter', system-ui, sans-serif; color: var(--c-main, #ffffff); transition: background-color 0.3s ease; }
    #app-chassis { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--c-bg, #000000); display: flex; flex-direction: column; }
    #bg-splash-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

    /* ジャンルセレクター */
    .genre-bar { position: relative; z-index: 10; display: flex; gap: 6px; padding: 6px 8px 0 8px; justify-content: center; }
    .genre-tab { flex: 1; max-width: 130px; height: 26px; border-radius: 8px; font-size: 10px; font-weight: 900; letter-spacing: 0.06em; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1.5px solid #333333; background: #111111; color: #888888; transition: all 0.2s ease; }
    .genre-tab.active { background: var(--c-accent); color: #000000; border-color: var(--c-accent); box-shadow: 0 0 10px var(--c-accent); }

    .chassis-grid { position: relative; z-index: 2; width: 100%; flex: 1; display: grid; grid-template-columns: 1fr; grid-template-rows: 34% 78px 1fr; gap: 6px; padding: 6px; overflow: hidden; min-height: 0; }
    @media (orientation: landscape) and (min-width: 520px) {
      .chassis-grid { grid-template-columns: 33% 76px 1fr; grid-template-rows: 100%; gap: 8px; padding: 8px; }
    }

    .hw-panel { border-radius: 16px; overflow: hidden; }
    .session-panel { display: flex; flex-direction: column; padding: 4px; gap: 4px; }
    .track-headers { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; flex-shrink: 0; }
    .track-pill { text-align: center; font-size: 8px; font-weight: 900; letter-spacing: 0.04em; padding: 4px 1px; border-radius: 8px; cursor: pointer; transition: all 0.12s ease; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: #111111; color: var(--c-main); border: 1.5px solid #282828; }
    .track-pill.selected { background: var(--c-accent); color: #000000; border-color: var(--c-accent); font-weight: 900; }

    .session-grid { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(4, 1fr); gap: 4px; min-height: 0; }
    .session-pad { position: relative; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; transition: border-color 0.12s ease, transform 0.08s ease; background: #0c0c0c; border: 1.5px solid #222222; }
    .session-pad:active { transform: scale(0.95); }
    .session-pad.selected { border: 2px solid var(--c-accent); box-shadow: 0 0 10px var(--c-accent); }
    .session-pad.queued { animation: padBlinkPlay 0.28s infinite alternate; }
    .session-pad.queued-stop { animation: padBlinkStop 0.28s infinite alternate; }
    @keyframes padBlinkPlay { from { border-color: #222222; } to { border-color: var(--c-accent); background: #163620; } }
    @keyframes padBlinkStop { from { border-color: var(--c-accent); } to { border-color: #444444; background: #331111; } }

    .mini-disc-canvas { display: block; pointer-events: none; }

    .knob-panel { display: flex; flex-direction: row; align-items: center; justify-content: space-around; padding: 4px 6px; gap: 3px; }
    @media (orientation: landscape) and (min-width: 520px) { .knob-panel { flex-direction: column; padding: 6px 4px; } }
    .knob-unit { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 100%; }
    .rotary-knob { position: relative; width: 40px; height: 40px; border-radius: 50%; cursor: ns-resize; touch-action: none; background: #111111; border: 2px solid #383838; }
    @media (orientation: landscape) and (min-width: 520px) { .rotary-knob { width: 44px; height: 44px; } }
    .knob-ring-svg { position: absolute; inset: -4px; width: calc(100% + 8px); height: calc(100% + 8px); pointer-events: none; }
    .knob-pointer { position: absolute; top: 3px; left: 50%; width: 3px; height: 13px; margin-left: -1.5px; border-radius: 2px; transform-origin: 50% 15px; pointer-events: none; background: var(--c-accent); }
    @media (orientation: landscape) and (min-width: 520px) { .knob-pointer { height: 14px; transform-origin: 50% 17px; } }
    .knob-label { font-size: 8px; font-weight: 900; letter-spacing: 0.05em; text-transform: uppercase; text-align: center; line-height: 1; color: #888888; }

    .mode-badge { font-size: 7px; font-weight: 900; padding: 2px 4px; border-radius: 4px; text-transform: uppercase; border: 1.5px solid #333333; color: #888888; background: #111111; cursor: pointer; }
    .mode-badge.sampler { border-color: var(--c-accent); color: var(--c-accent); }

    .right-column { display: grid; grid-template-columns: 1fr 84px; grid-template-rows: 100%; gap: 6px; min-width: 0; min-height: 0; }
    @media (orientation: landscape) and (min-width: 520px) { .right-column { grid-template-columns: 100%; grid-template-rows: 1fr 54px; gap: 8px; } }
    .disc-panel { position: relative; display: flex; align-items: center; justify-content: center; padding: 2px; min-width: 0; min-height: 0; }
    #main-disc-canvas { display: block; cursor: pointer; touch-action: none; }

    .transport-panel { display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 6px 4px; gap: 6px; }
    @media (orientation: landscape) and (min-width: 520px) { .transport-panel { flex-direction: row; padding: 4px 10px; gap: 8px; } }

    .hw-btn { height: 36px; width: 100%; padding: 0 8px; border-radius: 12px; font-size: 11px; font-weight: 900; letter-spacing: 0.05em; display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; transition: all 0.1s ease; border: 2px solid #333333; background: #111111; color: var(--c-main); flex-shrink: 0; }
    @media (orientation: landscape) and (min-width: 520px) { .hw-btn { width: auto; padding: 0 12px; } }
    .hw-btn:active { transform: scale(0.95); }

    .btn-play.playing { background: var(--c-accent); color: #000000; border-color: var(--c-accent); box-shadow: 0 0 12px var(--c-accent); }
    .btn-rec { color: #ff3366; border-color: #551122; }
    .btn-rec.armed { background: #441122; color: #ffaa33; border-color: #ffaa33; animation: recPulse 0.4s infinite alternate; }
    .btn-rec.recording { background: #ff1155; color: #ffffff; border-color: #ffffff; box-shadow: 0 0 14px rgba(255,17,85,0.8); animation: recPulse 0.25s infinite alternate; }
    @keyframes recPulse { from { opacity: 0.75; } to { opacity: 1; } }

    .bpm-knob-box { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 12px; padding: 2px 4px; width: 100%; flex-shrink: 0; }
    @media (orientation: landscape) and (min-width: 520px) { .bpm-knob-box { flex-direction: row; width: auto; padding: 3px 8px; gap: 6px; } }
    .bpm-rotary { position: relative; width: 34px; height: 34px; border-radius: 50%; cursor: ns-resize; touch-action: none; flex-shrink: 0; background: #111111; border: 2px solid #383838; }
    .bpm-pointer { position: absolute; top: 3px; left: 50%; width: 2.5px; height: 11px; margin-left: -1.25px; border-radius: 2px; transform-origin: 50% 12px; pointer-events: none; background: var(--c-accent); }
    .bpm-readout { display: flex; flex-direction: column; align-items: center; line-height: 1; }
    .bpm-val { font-size: 13px; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--c-accent); }
    .bpm-tag { font-size: 7px; font-weight: 900; letter-spacing: 0.06em; color: #888888; }
  </style>
</head>
<body>
  <div id="app-chassis">
    <header class="genre-bar">
      <button class="genre-tab active" data-genre="techno">TECHNO</button>
      <button class="genre-tab" data-genre="dnb">DNB</button>
      <button class="genre-tab" data-genre="synthwave">SYNTHWAVE</button>
    </header>

    <canvas id="bg-splash-canvas"></canvas>

    <div class="chassis-grid">
      <section class="hw-panel session-panel" aria-label="Session View">
        <div class="track-headers" id="track-headers"></div>
        <div class="session-grid" id="session-grid"></div>
      </section>

      <section class="hw-panel knob-panel" id="knob-panel" aria-label="Track Controls"></section>

      <div class="right-column">
        <section class="hw-panel disc-panel" id="disc-panel" aria-label="Disc Sequencer">
          <canvas id="main-disc-canvas"></canvas>
        </section>

        <section class="hw-panel transport-panel" aria-label="Transport Controls">
          <button id="btn-play" class="hw-btn btn-play" type="button">
            <span id="play-icon">&#9654;</span>
            <span id="play-text">PLAY</span>
          </button>

          <button id="btn-rec" class="hw-btn btn-rec" type="button">
            <span>&#9679;</span>
            <span id="rec-text">REC</span>
          </button>

          <div class="bpm-knob-box" title="ドラッグでBPM調整">
            <div class="bpm-rotary" id="bpm-knob">
              <div class="bpm-pointer" id="bpm-pointer"></div>
            </div>
            <div class="bpm-readout">
              <span class="bpm-val" id="bpm-display">135</span>
              <span class="bpm-tag">BPM</span>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const DEFAULT_SAMPLES = {
        techno: [ { track: 4, row: 0, url: 'samples/techno_voice.mp3' } ]
      };

      const DRUM_SLOT_CONFIG = {
        techno: {
          track: 0,
          slots: [
            { name: 'KICK',  url: 'samples/909_kick.wav' },
            { name: 'SNARE', url: 'samples/909_snare.wav' },
            { name: 'CH',    url: 'samples/909_ch.wav' },
            { name: 'OH',    url: 'samples/909_oh.wav' }
          ]
        },
        dnb: {
          track: 4,
          slots: [
            { name: 'KICK',        url: 'samples/break_kick.wav' },
            { name: 'SNARE',       url: 'samples/break_snare.wav' },
            { name: 'GHOST SNARE', url: 'samples/break_ghost.wav' },
            { name: 'HI-HAT',      url: 'samples/break_hat.wav' }
          ]
        },
        synthwave: {
          track: 4,
          slots: [
            { name: 'RETRO KICK',  url: 'samples/retro_kick.wav' },
            { name: 'RETRO SNARE', url: 'samples/retro_snare.wav' },
            { name: 'RETRO HAT',   url: 'samples/retro_hat.wav' },
            { name: 'RETRO TOM',   url: 'samples/retro_tom.wav' }
          ]
        }
      };

      function radiusToDrumSlot(radius, slotCount = 4) {
        const clamped = Math.max(0, Math.min(0.9999, radius));
        return Math.min(slotCount - 1, Math.floor(clamped * slotCount));
      }

      const GENRE_PRESETS = {
        techno: {
          name: 'TECHNO',
          bpm: 135,
          theme: { bg: '#000000', main: '#ffffff', accent: '#00ff66' },
          tracks: [
            { id: '909kit',    name: '909KIT',     mode: 'sampler', sampleType: 'drum',  scale: [36], pitched: false },
            { id: 'metalperc', name: 'METAL PERC', mode: 'synth',   synthType: 'metal', scale: [0, 3, 7, 10, 12], pitched: true, octaveOffset: 0 },
            { id: 'weird',     name: 'WEIRD',      mode: 'synth',   synthType: 'weird', scale: [0, 3, 7, 10, 12], pitched: false },
            { id: 'acid303',   name: 'ACID 303',   mode: 'synth',   synthType: 'acid',  scale: [55, 65.41, 73.42, 82.41, 98, 110, 130.81, 146.83, 164.81, 196, 220], pitched: false },
            { id: 'voice',     name: 'VOICE',      mode: 'sampler', sampleType: 'voice', scale: [-12, -9, -7, -5, -2, 0, 3, 5, 7, 10, 12], pitched: true }
          ]
        },
        dnb: {
          name: 'DNB',
          bpm: 170,
          theme: { bg: '#090b10', main: '#f0f6ff', accent: '#00e5ff' },
          tracks: [
            { id: 'reesebass',  name: 'REESE BASS',  mode: 'synth',   synthType: 'reese',      scale: [-24, -22, -19, -17, -15, -12, -10], pitched: true },
            { id: 'neurogrowl', name: 'NEURO GROWL', mode: 'synth',   synthType: 'neuro',      scale: [-24, -21, -19, -17, -14, -12, -10], pitched: true },
            { id: 'liquidpad',  name: 'LIQUID PAD',  mode: 'synth',   synthType: 'liquid_pad', scale: [-12, -9, -5, 0, 2, 7, 12], pitched: true, speed: 0.5 },
            { id: 'razorlead',  name: 'RAZOR LEAD',  mode: 'synth',   synthType: 'razor_lead', scale: [0, 3, 5, 7, 10, 12, 15, 17], pitched: true },
            { id: 'breakkit',   name: 'BREAK KIT',   mode: 'sampler', sampleType: 'drum',       scale: [36], pitched: false }
          ]
        },
        synthwave: {
          name: 'SYNTHWAVE',
          bpm: 108,
          theme: { bg: '#12061c', main: '#ffe6fa', accent: '#ff2a85' },
          tracks: [
            { id: 'retrobass',    name: 'RETRO BASS',    mode: 'synth',   synthType: 'retro_bass',    scale: [-24, -22, -19, -17, -15, -12, -10], pitched: true },
            { id: 'neonlead',     name: 'NEON LEAD',     mode: 'synth',   synthType: 'neon_lead',     scale: [-12, -9, -5, 0, 2, 7, 12, 14], pitched: true },
            { id: 'dreampad',     name: 'DREAM PAD',     mode: 'synth',   synthType: 'dream_pad',     scale: [-12, -9, -5, 0, 2, 7, 12], pitched: true, speed: 0.5 },
            { id: 'digitalpiano', name: 'DIGITAL PIANO', mode: 'synth',   synthType: 'digital_piano', scale: [-12, -9, -5, 0, 2, 7, 12, 14, 19], pitched: true },
            { id: 'retrodrumkit', name: 'RETRO DRUM',    mode: 'sampler', sampleType: 'drum',          scale: [36], pitched: false }
          ]
        }
      };

      let currentGenreKey = 'techno';
      let activeGenre = GENRE_PRESETS[currentGenreKey];

      const STEPS_PER_BAR = 16;
      const MIN_BPM = 70;
      const MAX_BPM = 190;

      let bpm = activeGenre.bpm;
      let isPlaying = false;
      let selectedTrack = 0;
      let selectedRow = 0;
      let recState = 'off';

      let currentStep = 0;
      let nextNoteTime = 0;
      let lastScheduledBarStart = 0;
      let barCounter = -1;
      let schedulerTimer = null;

      let mediaStream = null;
      let mediaRecorder = null;
      let recChunks = [];
      let recStartBarTime = 0;
      let recDurationSec = 0;

      const trackSpinPhase = [0, 0, 0, 0, 0];

      // 各トラックのノブ値（CUTOFF / RESO / DRIVE / VOL）
      const trackParams = [
        { cutoff: 0.65, reso: 0.5, decay: 0.5, drive: 0.25, volume: 0.8 },
        { cutoff: 0.50, reso: 0.4, decay: 0.4, drive: 0.15, volume: 0.8 },
        { cutoff: 0.75, reso: 0.6, decay: 0.6, drive: 0.30, volume: 0.8 },
        { cutoff: 0.60, reso: 0.5, decay: 0.5, drive: 0.20, volume: 0.8 },
        { cutoff: 0.70, reso: 0.4, decay: 0.7, drive: 0.10, volume: 0.8 }
      ];

      const sessionClips = Array.from({ length: 5 }, () =>
        Array.from({ length: 4 }, () => ({
          tokens: [],
          active: false,
          queued: false,
          queuedStop: false,
          audioBuffer: null,
          slots: [null, null, null, null]
        }))
      );

      // =========================================================================
      // 2. MODULAR AUDIO ENGINE & CUSTOM SYNTH ENGINES
      // =========================================================================
      const SYNTH_ENGINES = {
      　　metal: (engine, tIdx, time, radius, noteVal, p, _def, dest) => {
          const ctx = engine.ctx;
          const baseFreq = 440 * Math.pow(2, (noteVal + 7 - 9) / 12) * (0.8 + radius * 0.6);
          const dur = 0.06 + (1 - p.cutoff * 0.4) * 0.22;
          const ratios = [1, 1.414, 1.732, 2.356];

          const mix = ctx.createGain();
          mix.gain.setValueAtTime(0.001, time);
          mix.gain.linearRampToValueAtTime(0.45, time + 0.002);
          mix.gain.exponentialRampToValueAtTime(0.001, time + dur);

          const bp = ctx.createBiquadFilter();
          bp.type = 'bandpass';
          bp.frequency.setValueAtTime(600 + p.cutoff * 6000, time);
          bp.Q.value = 2 + p.reso * 14;

          mix.connect(bp);
          let outNode = bp;
          if (p.drive > 0.05) {
            const shaper = ctx.createWaveShaper();
            shaper.curve = engine.makeDistortionCurve(p.drive * 0.85);
            bp.connect(shaper);
            outNode = shaper;
          }
          outNode.connect(dest);

          // --- FMモジュレータ（金属的な非整数比でオシレータ群の周波数を揺らす） ---
          const fmMod = ctx.createOscillator();
          fmMod.type = 'sine';
          const fmRatio = 2.756 + radius * 1.1; // radiusで金属の倍音バランスが変化
          fmMod.frequency.setValueAtTime(baseFreq * fmRatio, time);

          const fmDepth = ctx.createGain();
          const modAmount = baseFreq * (1.2 + p.drive * 3.5 + p.reso * 1.5);
          fmDepth.gain.setValueAtTime(modAmount, time);
          fmDepth.gain.exponentialRampToValueAtTime(1, time + dur * 0.6);

          fmMod.connect(fmDepth);
          fmMod.start(time);
          fmMod.stop(time + dur + 0.02);
          engine.trackVoice(tIdx, fmMod, fmDepth);

          ratios.forEach((r, idx) => {
            const osc = ctx.createOscillator();
            osc.type = idx % 2 === 0 ? 'square' : 'triangle';
            const startFreq = baseFreq * r;
            const endFreq = Math.max(60, startFreq * 0.7);

            osc.frequency.setValueAtTime(startFreq, time);
            osc.frequency.exponentialRampToValueAtTime(endFreq, time + dur);

            // 各オシレータの周波数（frequency）にFMを接続（比率r分だけ深さを調整）
            const perOscGain = ctx.createGain();
            perOscGain.gain.setValueAtTime(r * 0.5, time);
            fmDepth.connect(perOscGain);
            perOscGain.connect(osc.frequency);

            osc.connect(mix);
            osc.start(time);
            osc.stop(time + dur + 0.02);
            engine.trackVoice(tIdx, osc, mix);
          });
        },

        weird: (engine, tIdx, time, radius, noteVal, p, _def, dest) => {
          const ctx = engine.ctx;
          const dur = 0.08 + p.decay * 0.45;
          const baseFreq = 180 + radius * 1100;

          const osc = ctx.createOscillator();
          const lfo = ctx.createOscillator();
          const lfoGain = ctx.createGain();
          const gain = ctx.createGain();

          const waves = ['sine', 'square', 'sawtooth', 'triangle'];
          osc.type = waves[Math.min(3, Math.floor(p.cutoff * 4))];
          osc.frequency.setValueAtTime(baseFreq, time);
          osc.frequency.exponentialRampToValueAtTime(Math.max(50, baseFreq * (0.4 + p.reso)), time + dur);

          lfo.type = 'sine';
          lfo.frequency.value = 12 + p.reso * 50;
          lfoGain.gain.value = 80 + radius * 350;
          lfo.connect(lfoGain);
          lfoGain.connect(osc.frequency);

          gain.gain.setValueAtTime(0.4, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + dur);

          let node = osc;
          if (p.drive > 0.05) {
            const shaper = ctx.createWaveShaper();
            shaper.curve = engine.makeDistortionCurve(p.drive * 0.8);
            osc.connect(shaper);
            node = shaper;
          }

          node.connect(gain);
          gain.connect(dest);

          osc.start(time);
          lfo.start(time);
          osc.stop(time + dur + 0.02);
          lfo.stop(time + dur + 0.02);
          engine.trackVoice(tIdx, osc, gain, lfo);
        },

        reese: (engine, tIdx, time, radius, noteVal, p, _def, dest) => {
          const ctx = engine.ctx;
          const freq = 440 * Math.pow(2, (noteVal - 9) / 12);
          const stepDur = (60 / bpm) / 4;
          const dur = Math.max(stepDur * 1.5, stepDur * 3.5);

          const lp = ctx.createBiquadFilter();
          lp.type = 'lowpass';
          const baseCut = 180 + p.cutoff * 2800 + radius * 800;
          lp.frequency.setValueAtTime(baseCut, time);
          lp.Q.value = 1.5 + p.reso * 10;

          const lfo = ctx.createOscillator();
          const lfoGain = ctx.createGain();
          lfo.type = 'sine';
          lfo.frequency.setValueAtTime(2 + radius * 10, time);
          lfoGain.gain.setValueAtTime(baseCut * 0.45, time);
          lfo.connect(lfoGain);
          lfoGain.connect(lp.frequency);

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.001, time);
          gain.gain.linearRampToValueAtTime(0.42, time + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.001, time + dur);

          lp.connect(gain);
          let outNode = gain;
          if (p.drive > 0.05) {
            const shaper = ctx.createWaveShaper();
            shaper.curve = engine.makeDistortionCurve(p.drive * 0.7);
            gain.connect(shaper);
            outNode = shaper;
          }
          outNode.connect(dest);

          [-14, 14].forEach((det) => {
            const osc = ctx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, time);
            osc.detune.setValueAtTime(det, time);
            osc.connect(lp);
            osc.start(time);
            osc.stop(time + dur + 0.03);
            engine.trackVoice(tIdx, osc, gain);
          });
          lfo.start(time);
          lfo.stop(time + dur + 0.03);
          engine.trackVoice(tIdx, lfo, null);
        },

        neuro: (engine, tIdx, time, radius, noteVal, p, _def, dest) => {
          const ctx = engine.ctx;
          const freq = 440 * Math.pow(2, (noteVal - 9) / 12);
          const stepDur = (60 / bpm) / 4;
          const dur = Math.max(stepDur * 1.2, stepDur * 2.5);

          const carrier = ctx.createOscillator();
          carrier.type = 'sawtooth';
          carrier.frequency.setValueAtTime(freq, time);

          const subSquare = ctx.createOscillator();
          subSquare.type = 'square';
          subSquare.frequency.setValueAtTime(freq * 0.5, time);

          const fmOsc = ctx.createOscillator();
          const fmGain = ctx.createGain();
          fmOsc.type = 'sine';
          fmOsc.frequency.setValueAtTime(freq * 2, time);
          fmGain.gain.setValueAtTime(freq * (1.2 + radius * 3.5), time);
          fmGain.gain.exponentialRampToValueAtTime(40, time + dur * 0.85);
          fmOsc.connect(fmGain);
          fmGain.connect(carrier.frequency);

          const bp = ctx.createBiquadFilter();
          bp.type = 'bandpass';
          bp.frequency.setValueAtTime(300 + p.cutoff * 3500, time);
          bp.frequency.exponentialRampToValueAtTime(Math.max(120, 180 + p.cutoff * 1200), time + dur);
          bp.Q.value = 2 + p.reso * 12;

          const shaper = ctx.createWaveShaper();
          shaper.curve = engine.makeDistortionCurve(Math.max(0.25, p.drive * 0.9));

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.001, time);
          gain.gain.linearRampToValueAtTime(0.45, time + 0.006);
          gain.gain.exponentialRampToValueAtTime(0.001, time + dur);

          carrier.connect(bp);
          subSquare.connect(bp);
          bp.connect(shaper);
          shaper.connect(gain);
          gain.connect(dest);

          carrier.start(time);
          subSquare.start(time);
          fmOsc.start(time);
          carrier.stop(time + dur + 0.03);
          subSquare.stop(time + dur + 0.03);
          fmOsc.stop(time + dur + 0.03);
          engine.trackVoice(tIdx, carrier, gain);
          engine.trackVoice(tIdx, subSquare, gain);
          engine.trackVoice(tIdx, fmOsc, null);
        },

        liquid_pad: (engine, tIdx, time, radius, noteVal, p, _def, dest) => {
          const ctx = engine.ctx;
          const freq = 440 * Math.pow(2, (noteVal - 9) / 12);
          const stepDur = (60 / bpm) / 4;
          const dur = Math.max(stepDur * 6, 0.8);

          const lp = ctx.createBiquadFilter();
          lp.type = 'lowpass';
          lp.frequency.setValueAtTime(400 + p.cutoff * 3600 + radius * 800, time);
          lp.Q.value = 0.7 + p.reso * 5;

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.001, time);
          gain.gain.linearRampToValueAtTime(0.28, time + dur * 0.35);
          gain.gain.linearRampToValueAtTime(0.22, time + dur * 0.75);
          gain.gain.exponentialRampToValueAtTime(0.001, time + dur);

          lp.connect(gain);
          gain.connect(dest);

          const configs = [
            { type: 'sawtooth', det: -10, amp: 0.35 },
            { type: 'sawtooth', det: 10,  amp: 0.35 },
            { type: 'sine',     det: 0,   amp: 0.5 }
          ];
          configs.forEach((c) => {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = c.type;
            osc.frequency.setValueAtTime(freq, time);
            osc.detune.setValueAtTime(c.det, time);
            g.gain.value = c.amp;
            osc.connect(g);
            g.connect(lp);
            osc.start(time);
            osc.stop(time + dur + 0.04);
            engine.trackVoice(tIdx, osc, gain);
          });
        },

        razor_lead: (engine, tIdx, time, radius, noteVal, p, _def, dest) => {
          const ctx = engine.ctx;
          const freq = 440 * Math.pow(2, (noteVal + 12 - 9) / 12);
          const stepDur = (60 / bpm) / 4;
          const dur = Math.max(stepDur * 0.6, stepDur * 1.4);

          const lp = ctx.createBiquadFilter();
          lp.type = 'lowpass';
          const cut = 1200 + p.cutoff * 7000 + radius * 1200;
          lp.frequency.setValueAtTime(cut, time);
          lp.frequency.exponentialRampToValueAtTime(Math.max(300, cut * 0.3), time + dur);
          lp.Q.value = 1 + p.reso * 8;

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.001, time);
          gain.gain.linearRampToValueAtTime(0.35, time + 0.004);
          gain.gain.exponentialRampToValueAtTime(0.001, time + dur);

          lp.connect(gain);
          let outNode = gain;
          if (p.drive > 0.05) {
            const shaper = ctx.createWaveShaper();
            shaper.curve = engine.makeDistortionCurve(p.drive * 0.65);
            gain.connect(shaper);
            outNode = shaper;
          }
          outNode.connect(dest);

          [
            { type: 'sawtooth', det: -7 },
            { type: 'sawtooth', det: 7 },
            { type: 'square',   det: 0 }
          ].forEach((c) => {
            const osc = ctx.createOscillator();
            osc.type = c.type;
            osc.frequency.setValueAtTime(freq, time);
            osc.detune.setValueAtTime(c.det, time);
            osc.connect(lp);
            osc.start(time);
            osc.stop(time + dur + 0.03);
            engine.trackVoice(tIdx, osc, gain);
          });
        },

        retro_bass: (engine, tIdx, time, radius, noteVal, p, _def, dest) => {
          const ctx = engine.ctx;
          const freq = 440 * Math.pow(2, (noteVal - 9) / 12);
          const stepDur = (60 / bpm) / 4;
          const dur = Math.max(stepDur * 1.2, stepDur * 2.5);

          const lp = ctx.createBiquadFilter();
          lp.type = 'lowpass';
          const cut = 180 + p.cutoff * 2400 + radius * 600;
          lp.frequency.setValueAtTime(cut, time);
          lp.frequency.exponentialRampToValueAtTime(Math.max(90, cut * 0.4), time + dur);
          lp.Q.value = 1.2 + p.reso * 8;

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.001, time);
          gain.gain.linearRampToValueAtTime(0.45, time + 0.008);
          gain.gain.exponentialRampToValueAtTime(0.001, time + dur);

          lp.connect(gain);
          let outNode = gain;
          if (p.drive > 0.05) {
            const shaper = ctx.createWaveShaper();
            shaper.curve = engine.makeDistortionCurve(p.drive * 0.6);
            gain.connect(shaper);
            outNode = shaper;
          }
          outNode.connect(dest);

          ['sawtooth', 'triangle'].forEach((w, i) => {
            const osc = ctx.createOscillator();
            osc.type = w;
            osc.frequency.setValueAtTime(freq * (i === 1 ? 0.5 : 1), time);
            osc.connect(lp);
            osc.start(time);
            osc.stop(time + dur + 0.03);
            engine.trackVoice(tIdx, osc, gain);
          });
        },

        neon_lead: (engine, tIdx, time, radius, noteVal, p, _def, dest) => {
          const ctx = engine.ctx;
          const freq = 440 * Math.pow(2, (noteVal + 12 - 9) / 12);
          const stepDur = (60 / bpm) / 4;
          const dur = Math.max(stepDur * 1.5, stepDur * 3.0);

          const lp = ctx.createBiquadFilter();
          lp.type = 'lowpass';
          lp.frequency.setValueAtTime(800 + p.cutoff * 6000 + radius * 1000, time);
          lp.Q.value = 1.5 + p.reso * 9;

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.001, time);
          gain.gain.linearRampToValueAtTime(0.32, time + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, time + dur);

          lp.connect(gain);
          let outNode = gain;
          if (p.drive > 0.05) {
            const shaper = ctx.createWaveShaper();
            shaper.curve = engine.makeDistortionCurve(p.drive * 0.6);
            gain.connect(shaper);
            outNode = shaper;
          }
          outNode.connect(dest);

          [-9, 9].forEach((det) => {
            const osc = ctx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, time);
            osc.detune.setValueAtTime(det, time);
            osc.connect(lp);
            osc.start(time);
            osc.stop(time + dur + 0.03);
            engine.trackVoice(tIdx, osc, gain);
          });
        },

        dream_pad: (engine, tIdx, time, radius, noteVal, p, _def, dest) => {
          const ctx = engine.ctx;
          const freq = 440 * Math.pow(2, (noteVal - 9) / 12);
          const stepDur = (60 / bpm) / 4;
          const dur = Math.max(stepDur * 6, 0.9);

          const lp = ctx.createBiquadFilter();
          lp.type = 'lowpass';
          lp.frequency.setValueAtTime(350 + p.cutoff * 3200 + radius * 700, time);
          lp.Q.value = 0.8 + p.reso * 6;

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.001, time);
          gain.gain.linearRampToValueAtTime(0.28, time + dur * 0.35);
          gain.gain.exponentialRampToValueAtTime(0.001, time + dur);

          lp.connect(gain);
          gain.connect(dest);

          [-12, 0, 12].forEach((det, idx) => {
            const osc = ctx.createOscillator();
            osc.type = idx === 1 ? 'triangle' : 'sawtooth';
            osc.frequency.setValueAtTime(freq, time);
            osc.detune.setValueAtTime(det, time);
            osc.connect(lp);
            osc.start(time);
            osc.stop(time + dur + 0.04);
            engine.trackVoice(tIdx, osc, gain);
          });
        },

        digital_piano: (engine, tIdx, time, radius, noteVal, p, _def, dest) => {
          const ctx = engine.ctx;
          const freq = 440 * Math.pow(2, (noteVal + 12 - 9) / 12);
          const stepDur = (60 / bpm) / 4;
          const dur = Math.max(stepDur * 2.0, 0.45);

          const carrier = ctx.createOscillator();
          carrier.type = 'sine';
          carrier.frequency.setValueAtTime(freq, time);

          const mod = ctx.createOscillator();
          const modGain = ctx.createGain();
          mod.type = 'sine';
          mod.frequency.setValueAtTime(freq * 2, time);
          modGain.gain.setValueAtTime(freq * (0.4 + radius * 1.2), time);
          modGain.gain.exponentialRampToValueAtTime(1, time + dur * 0.5);
          mod.connect(modGain);
          modGain.connect(carrier.frequency);

          const lp = ctx.createBiquadFilter();
          lp.type = 'lowpass';
          lp.frequency.setValueAtTime(900 + p.cutoff * 6500, time);
          lp.Q.value = 0.7 + p.reso * 5;

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.001, time);
          gain.gain.linearRampToValueAtTime(0.38, time + 0.005);
          gain.gain.exponentialRampToValueAtTime(0.001, time + dur);

          carrier.connect(lp);
          lp.connect(gain);
          let outNode = gain;
          if (p.drive > 0.05) {
            const shaper = ctx.createWaveShaper();
            shaper.curve = engine.makeDistortionCurve(p.drive * 0.5);
            gain.connect(shaper);
            outNode = shaper;
          }
          outNode.connect(dest);

          carrier.start(time);
          mod.start(time);
          carrier.stop(time + dur + 0.03);
          mod.stop(time + dur + 0.03);
          engine.trackVoice(tIdx, carrier, gain);
          engine.trackVoice(tIdx, mod, null);
        }
      };

      class ModularSoundEngine {
        constructor() {
          this.ctx = null;
          this.masterGain = null;
          this.trackGains = [];
          this.prevFreqs = [110, 110, 110, 110, 110];
          this.trackActiveVoices = Array.from({ length: 5 }, () => ({ batchTime: -1, nodes: [] }));
          this.sampleBuffers = { mallet: null, kalimba: null };
        }

        ensureContext() {
          try {
            if (!this.ctx) {
              const AudioCtx = window.AudioContext || window.webkitAudioContext;
              this.ctx = new AudioCtx();
              this.masterGain = this.ctx.createGain();
              this.masterGain.gain.value = 0.85;
              this.masterGain.connect(this.ctx.destination);

              this.trackGains = trackParams.map((tp) => {
                const tg = this.ctx.createGain();
                tg.gain.value = tp.volume;
                tg.connect(this.masterGain);
                return tg;
              });

              this.generateDefaultSamples();
            }
            if (this.ctx.state === 'suspended') {
              this.ctx.resume();
            }
            this.syncTrackVolumes();
          } catch (_) {}
        }

        syncTrackVolumes() {
          if (!this.ctx || !this.trackGains.length) return;
          const now = this.ctx.currentTime;
          for (let t = 0; t < this.trackGains.length; t++) {
            const g = this.trackGains[t].gain;
            g.cancelScheduledValues(now);
            g.setTargetAtTime(trackParams[t].volume, now, 0.01);
          }
        }

        generateDefaultSamples() {
          const sr = this.ctx.sampleRate;
          const mLen = sr * 1.4;
          const mBuf = this.ctx.createBuffer(1, mLen, sr);
          const mData = mBuf.getChannelData(0);
          for (let i = 0; i < mLen; i++) {
            const t = i / sr;
            const env = Math.exp(-t * 6.5);
            mData[i] = (Math.sin(2 * Math.PI * 523.25 * t) * 0.6 +
                        Math.sin(2 * Math.PI * 523.25 * 2.76 * t) * 0.25 +
                        Math.sin(2 * Math.PI * 523.25 * 5.4 * t) * 0.15) * env;
          }
          this.sampleBuffers.mallet = mBuf;

          const kLen = sr * 1.8;
          const kBuf = this.ctx.createBuffer(1, kLen, sr);
          const kData = kBuf.getChannelData(0);
          for (let i = 0; i < kLen; i++) {
            const t = i / sr;
            const env = Math.exp(-t * 4.5);
            kData[i] = (Math.sin(2 * Math.PI * 392 * t) * 0.7 +
                        Math.sin(2 * Math.PI * 392 * 3.0 * t) * 0.2 +
                        Math.sin(2 * Math.PI * 392 * 6.0 * t) * 0.1) * env;
          }
          this.sampleBuffers.kalimba = kBuf;
        }

        makeDistortionCurve(amount) {
          const k = amount * 180;
          const nSamples = 256;
          const curve = new Float32Array(nSamples);
          for (let i = 0; i < nSamples; i++) {
            const x = (i * 2) / nSamples - 1;
            curve[i] = k === 0 ? x : ((3 + k) * x * 20 * (Math.PI / 180)) / (Math.PI + k * Math.abs(x));
          }
          return curve;
        }

        trackVoice(tIdx, src, gain) {
          const entry = { src, gain, stopped: false };
          this.trackActiveVoices[tIdx].nodes.push(entry);
          src.onended = () => {
            entry.stopped = true;
            const list = this.trackActiveVoices[tIdx].nodes;
            const idx = list.indexOf(entry);
            if (idx !== -1) list.splice(idx, 1);
          };
        }

        handleVoiceStealing(tIdx, time) {
          const voiceState = this.trackActiveVoices[tIdx];
          // 完了済みノードを掃除
          voiceState.nodes = voiceState.nodes.filter(v => !v.stopped);

          if (Math.abs(time - voiceState.batchTime) > 0.005) {
            const stopTime = Math.max(this.ctx.currentTime, time);
            for (const v of voiceState.nodes) {
              if (v.stopped) continue;
              v.stopped = true;
              try {
                if (v.gain) {
                  v.gain.gain.cancelScheduledValues(stopTime);
                  v.gain.gain.setTargetAtTime(0.0001, stopTime, 0.003);
                }
                v.src.stop(stopTime + 0.012);
              } catch (_) {}
            }
            voiceState.nodes = [];
            voiceState.batchTime = time;
          }
        }

        triggerTrack(tIdx, time, radius, clip) {
          if (!this.ctx) return;
          const def = activeGenre.tracks[tIdx];
          const p = trackParams[tIdx];
          const dest = this.trackGains[tIdx] || this.masterGain;

          const scale = def.scale;
          const scaleIdx = Math.min(scale.length - 1, Math.floor((1 - radius) * scale.length));
          const noteVal = scale[scaleIdx];

          if (def.mode === 'sampler') {
            let buffer = null;

            if (!def.pitched && Array.isArray(clip.slots) && clip.slots.some(Boolean)) {
              const slotIdx = radiusToDrumSlot(radius, clip.slots.length);
              buffer = clip.slots[slotIdx] || clip.slots.find(Boolean);
            } else {
              buffer = clip.audioBuffer;
              if (!buffer) {
                if (def.sampleType === 'mallet') buffer = this.sampleBuffers.mallet;
                else if (def.sampleType === 'kalimba') buffer = this.sampleBuffers.kalimba;
              }
            }
            if (!buffer) return;

            this.handleVoiceStealing(tIdx, time);

            const src = this.ctx.createBufferSource();
            src.buffer = buffer;

            if (def.pitched) {
              const rate = Math.pow(2, noteVal / 12);
              src.playbackRate.setValueAtTime(rate, time);
            }

            const filter = this.ctx.createBiquadFilter();
            filter.type = 'lowpass';
            const cutoffFreq = 250 + Math.pow(p.cutoff, 2) * 15000;
            filter.frequency.setValueAtTime(cutoffFreq, time);
            filter.Q.value = p.reso * 10;

            const gainNode = this.ctx.createGain();
            const dur = Math.max(0.1, buffer.duration || 0.6);
            gainNode.gain.setValueAtTime(0.001, time);
            gainNode.gain.linearRampToValueAtTime(0.85, time + 0.004);
            gainNode.gain.exponentialRampToValueAtTime(0.001, time + dur);

            let lastNode = filter;
            if (p.drive > 0.05) {
              const shaper = this.ctx.createWaveShaper();
              shaper.curve = this.makeDistortionCurve(p.drive * 0.7);
              filter.connect(shaper);
              lastNode = shaper;
            }

            src.connect(filter);
            lastNode.connect(gainNode);
            gainNode.connect(dest);

            src.start(time);
            src.stop(time + dur + 0.02);
            this.trackVoice(tIdx, src, gainNode);
          } else {
            if (def.synthType === 'acid') {
              this.triggerAcid303(tIdx, time, radius, noteVal, p, dest);
            } else if (SYNTH_ENGINES[def.synthType]) {
              SYNTH_ENGINES[def.synthType](this, tIdx, time, radius, noteVal, p, def, dest);
            }
          }
        }

        triggerAcid303(tIdx, time, radius, freq, p, dest) {
          const stepDur = (60 / bpm) / 4;
          const dur = stepDur * (2.0 + p.decay * 10.0);

          if (this.acidVoice && !this.acidVoice.stopped) {
            this.acidVoice.stopped = true;
            try {
              this.acidVoice.choke.gain.cancelScheduledValues(time);
              this.acidVoice.choke.gain.setTargetAtTime(0.0001, time, 0.003);
              this.acidVoice.osc.stop(time + 0.015);
            } catch (_) {}
          }

          const osc = this.ctx.createOscillator();
          osc.type = 'sawtooth';
          const prevFreq = this.prevFreqs[tIdx] || 110;
          const glide = Math.min(0.09, stepDur * 0.7);
          osc.frequency.setValueAtTime(prevFreq, time);
          osc.frequency.exponentialRampToValueAtTime(freq, time + glide);
          this.prevFreqs[tIdx] = freq;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          const baseCutoff = 160 + p.cutoff * 3800;
          filter.frequency.setValueAtTime(Math.min(12000, baseCutoff + radius * 1600), time);
          filter.frequency.exponentialRampToValueAtTime(Math.max(110, baseCutoff * 0.35), time + dur * 0.85);
          filter.Q.value = 2 + p.reso * 18;

          const shaper = this.ctx.createWaveShaper();
          shaper.curve = this.makeDistortionCurve(Math.max(0.1, p.drive * 0.85));

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.001, time);
          gain.gain.linearRampToValueAtTime(0.45, time + 0.008);
          gain.gain.exponentialRampToValueAtTime(0.001, time + dur * 0.95);

          const choke = this.ctx.createGain();
          choke.gain.setValueAtTime(1, time);

          osc.connect(filter);
          filter.connect(shaper);
          shaper.connect(gain);
          gain.connect(choke);
          choke.connect(dest);

          osc.start(time);
          osc.stop(time + dur + 0.02);
          const voiceObj = { osc, choke, stopped: false };
          osc.onended = () => { voiceObj.stopped = true; };
          this.acidVoice = voiceObj;
        }

        stopAllVoices() {
          for (let t = 0; t < this.trackActiveVoices.length; t++) {
            const vState = this.trackActiveVoices[t];
            for (const v of vState.nodes) {
              if (v.stopped) continue;
              v.stopped = true;
              try { v.src.stop(); } catch (_) {}
            }
            vState.nodes = [];
          }
          if (this.acidVoice && !this.acidVoice.stopped) {
            this.acidVoice.stopped = true;
            try { this.acidVoice.osc.stop(); } catch (_) {}
          }
        }
      }

      const sound = new ModularSoundEngine();

      // =========================================================================
      // 3. SCHEDULER & RECORDING
      // =========================================================================
      function applyQueuedClips() {
        let changed = false;
        for (let t = 0; t < 5; t++) {
          const queuedPlayIdx = sessionClips[t].findIndex(c => c.queued);
          const queuedStopIdx = sessionClips[t].findIndex(c => c.queuedStop);

          if (queuedPlayIdx !== -1) {
            for (let r = 0; r < 4; r++) {
              sessionClips[t][r].active = false;
              sessionClips[t][r].queued = false;
              sessionClips[t][r].queuedStop = false;
            }
            sessionClips[t][queuedPlayIdx].active = true;
            changed = true;
          } else if (queuedStopIdx !== -1) {
            sessionClips[t][queuedStopIdx].active = false;
            sessionClips[t][queuedStopIdx].queuedStop = false;
            changed = true;
          }
        }
        if (changed) updateSessionPadVisuals();
      }

      function getTrackDiv(t) {
        const s = activeGenre.tracks[t].speed;
        return (s && s > 0 && s < 1) ? Math.round(1 / s) : 1;
      }

      function scheduleStep(step, time) {
        if (step === 0) {
          lastScheduledBarStart = time;
          barCounter++;
          applyQueuedClips();

          if (recState === 'armed') startMediaRecording(time);
          else if (recState === 'recording') stopMediaRecording();
        }

        const absStep = Math.max(0, barCounter) * STEPS_PER_BAR + step;

        for (let t = 0; t < 5; t++) {
          const activeClip = sessionClips[t].find(c => c.active);
          if (!activeClip) continue;

          const div = getTrackDiv(t);
          if (absStep % div !== 0) continue;
          const trackStep = Math.floor(absStep / div) % STEPS_PER_BAR;

          const hits = activeClip.tokens.filter(tok => tok.step === trackStep);
          for (const tok of hits) {
            sound.triggerTrack(t, time, tok.radius, activeClip);
          }
        }
      }

      function schedulerLoop() {
        if (!isPlaying || !sound.ctx) return;
        const stepDur = (60 / bpm) / 4;
        const lookahead = 0.1;

        while (nextNoteTime < sound.ctx.currentTime + lookahead) {
          scheduleStep(currentStep, nextNoteTime);
          nextNoteTime += stepDur;
          currentStep = (currentStep + 1) % STEPS_PER_BAR;
        }
      }

      function startPlayback() {
        sound.ensureContext();
        if (isPlaying) return;
        isPlaying = true;
        currentStep = 0;
        barCounter = -1;
        const now = sound.ctx ? sound.ctx.currentTime + 0.03 : 0;
        nextNoteTime = now;
        lastScheduledBarStart = now;

        for (let t = 0; t < 5; t++) {
          if (!sessionClips[t].some(c => c.active)) {
            sessionClips[t][selectedRow].active = true;
          }
        }
        updateSessionPadVisuals();
        updateTransportUI();

        schedulerTimer = setInterval(schedulerLoop, 25);
      }

      function stopPlayback() {
        isPlaying = false;
        if (schedulerTimer) {
          clearInterval(schedulerTimer);
          schedulerTimer = null;
        }
        sound.stopAllVoices();
        for (let t = 0; t < 5; t++) {
          trackSpinPhase[t] = 0;
          for (let r = 0; r < 4; r++) {
            sessionClips[t][r].queued = false;
            sessionClips[t][r].queuedStop = false;
          }
        }
        if (recState !== 'off') {
          recState = 'off';
          if (mediaRecorder && mediaRecorder.state === 'recording') {
            try { mediaRecorder.stop(); } catch(_) {}
          }
        }
        updateSessionPadVisuals();
        updateTransportUI();
      }

      async function prepareMicAndArm() {
        sound.ensureContext();
        selectedTrack = 4;
        updateTrackHeaders();
        renderKnobPanel();

        try {
          if (!mediaStream) {
            mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          }
          recState = 'armed';
          updateTransportUI();
          if (!isPlaying) startPlayback();
        } catch (err) {
          alert('マイクの使用が許可されていません: ' + err.message);
          recState = 'off';
          updateTransportUI();
        }
      }

      function startMediaRecording(time) {
        if (!mediaStream) return;
        recChunks = [];
        const options = MediaRecorder.isTypeSupported('audio/webm') ? { mimeType: 'audio/webm' } : undefined;
        try {
          mediaRecorder = options ? new MediaRecorder(mediaStream, options) : new MediaRecorder(mediaStream);
        } catch (_) {
          mediaRecorder = new MediaRecorder(mediaStream);
        }

        mediaRecorder.ondataavailable = (ev) => {
          if (ev.data && ev.data.size > 0) recChunks.push(ev.data);
        };

        mediaRecorder.onstop = async () => {
          try {
            const blob = new Blob(recChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
            const arrBuf = await blob.arrayBuffer();
            const decoded = await sound.ctx.decodeAudioData(arrBuf);
            const clip = sessionClips[selectedTrack][selectedRow];
            clip.audioBuffer = decoded;
            clip.active = true;
            if (clip.tokens.length === 0) clip.tokens.push({ step: 0, radius: 0.5 });
            updateSessionPadVisuals();
          } catch (e) {
            console.error('録音デコードエラー:', e);
          }
          recState = 'off';
          updateTransportUI();
        };

        recStartBarTime = time;
        recDurationSec = (60 / bpm) * 4;
        recState = 'recording';
        updateTransportUI();
        mediaRecorder.start();
      }

      function stopMediaRecording() {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
          try { mediaRecorder.stop(); } catch(_) {}
        }
      }

      // =========================================================================
      // 4. GENRE SWITCHER
      // =========================================================================
      async function loadDefaultSamples(key) {
        const list = DEFAULT_SAMPLES[key];
        sound.ensureContext();
        if (list) {
          for (const item of list) {
            try {
              const res = await fetch(item.url);
              if (!res.ok) continue;
              const arrBuf = await res.arrayBuffer();
              const decoded = await sound.ctx.decodeAudioData(arrBuf);
              const clip = sessionClips[item.track][item.row];
              clip.audioBuffer = decoded;
              if (clip.tokens.length === 0) clip.tokens.push({ step: 0, radius: 0.5 });
              updateSessionPadVisuals();
            } catch (_) {}
          }
        }

        const drumCfg = DRUM_SLOT_CONFIG[key];
        if (drumCfg && Array.isArray(drumCfg.slots)) {
          for (let sIdx = 0; sIdx < drumCfg.slots.length; sIdx++) {
            const slotDef = drumCfg.slots[sIdx];
            if (!slotDef || !slotDef.url) continue;
            try {
              const res = await fetch(slotDef.url);
              if (!res.ok) continue;
              const arrBuf = await res.arrayBuffer();
              const decoded = await sound.ctx.decodeAudioData(arrBuf);
              for (let r = 0; r < 4; r++) {
                sessionClips[drumCfg.track][r].slots[sIdx] = decoded;
              }
            } catch (_) {}
          }
        }
      }

      function setGenre(key) {
        if (!GENRE_PRESETS[key]) return;
        currentGenreKey = key;
        activeGenre = GENRE_PRESETS[key];
        bpm = activeGenre.bpm;

        const root = document.documentElement.style;
        root.setProperty('--c-bg', activeGenre.theme.bg);
        root.setProperty('--c-main', activeGenre.theme.main);
        root.setProperty('--c-accent', activeGenre.theme.accent);

        document.querySelectorAll('.genre-tab').forEach(tab => {
          tab.classList.toggle('active', tab.dataset.genre === key);
        });

        syncBpmUI();
        paintBackgroundChassis();
        buildSessionUI();
        renderKnobPanel();
        loadDefaultSamples(key);
      }

      document.querySelectorAll('.genre-tab').forEach(tab => {
        tab.addEventListener('click', () => setGenre(tab.dataset.genre));
      });

      // =========================================================================
      // 5. UI BUILDERS
      // =========================================================================
      const trackHeadersEl = document.getElementById('track-headers');
      const sessionGridEl = document.getElementById('session-grid');
      const miniDiscItems = [];

      function buildSessionUI() {
        trackHeadersEl.innerHTML = '';
        sessionGridEl.innerHTML = '';
        miniDiscItems.length = 0;

        activeGenre.tracks.forEach((tr, tIdx) => {
          const pill = document.createElement('div');
          pill.className = 'track-pill' + (tIdx === selectedTrack ? ' selected' : '');
          pill.textContent = tr.name;
          pill.addEventListener('click', () => {
            selectedTrack = tIdx;
            updateTrackHeaders();
            updateSessionPadVisuals();
            renderKnobPanel();
          });
          trackHeadersEl.appendChild(pill);
        });

        for (let r = 0; r < 4; r++) {
          for (let t = 0; t < 5; t++) {
            const pad = document.createElement('div');
            pad.className = 'session-pad';
            const canvas = document.createElement('canvas');
            canvas.className = 'mini-disc-canvas';
            pad.appendChild(canvas);
            sessionGridEl.appendChild(pad);

            miniDiscItems.push({ t, r, pad, canvas, ctx: canvas.getContext('2d') });

            pad.addEventListener('click', () => {
              sound.ensureContext();
              selectedTrack = t;
              selectedRow = r;
              updateTrackHeaders();
              renderKnobPanel();

              const clip = sessionClips[t][r];
              if (!isPlaying) {
                const wasActive = clip.active;
                for (let rr = 0; rr < 4; rr++) {
                  sessionClips[t][rr].active = false;
                  sessionClips[t][rr].queued = false;
                  sessionClips[t][rr].queuedStop = false;
                }
                clip.active = !wasActive;
              } else {
                if (clip.active) {
                  clip.queuedStop = !clip.queuedStop;
                  clip.queued = false;
                } else {
                  for (let rr = 0; rr < 4; rr++) {
                    sessionClips[t][rr].queued = false;
                    sessionClips[t][rr].queuedStop = false;
                  }
                  clip.queued = true;
                }
              }
              updateSessionPadVisuals();
            });
          }
        }
        updateSessionPadVisuals();
      }

      function updateTrackHeaders() {
        const pills = trackHeadersEl.querySelectorAll('.track-pill');
        pills.forEach((p, idx) => {
          p.classList.toggle('selected', idx === selectedTrack);
        });
      }

      function updateSessionPadVisuals() {
        for (const item of miniDiscItems) {
          const clip = sessionClips[item.t][item.r];
          const isSel = item.t === selectedTrack && item.r === selectedRow;
          item.pad.classList.toggle('selected', isSel);
          item.pad.classList.toggle('queued', clip.queued);
          item.pad.classList.toggle('queued-stop', clip.queuedStop);
        }
      }

      const knobPanelEl = document.getElementById('knob-panel');
      let activeKnobDrag = null;

      window.addEventListener('mousemove', (e) => {
        if (!activeKnobDrag) return;
        activeKnobDrag.onMove(e.clientY);
      });
      window.addEventListener('mouseup', () => { activeKnobDrag = null; });
      window.addEventListener('touchmove', (e) => {
        if (!activeKnobDrag || e.touches.length === 0) return;
        e.preventDefault();
        activeKnobDrag.onMove(e.touches[0].clientY);
      }, { passive: false });
      window.addEventListener('touchend', () => { activeKnobDrag = null; });

      function createKnobElement(label, getVal, setVal) {
        const unit = document.createElement('div');
        unit.className = 'knob-unit';

        const knob = document.createElement('div');
        knob.className = 'rotary-knob';

        const svgNS = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(svgNS, 'svg');
        svg.setAttribute('viewBox', '0 0 60 60');
        svg.classList.add('knob-ring-svg');

        const bgArc = document.createElementNS(svgNS, 'circle');
        bgArc.setAttribute('cx', '30'); bgArc.setAttribute('cy', '30'); bgArc.setAttribute('r', '26');
        bgArc.setAttribute('fill', 'none'); bgArc.setAttribute('stroke', '#222222'); bgArc.setAttribute('stroke-width', '3.5');

        const valArc = document.createElementNS(svgNS, 'circle');
        valArc.setAttribute('cx', '30'); valArc.setAttribute('cy', '30'); valArc.setAttribute('r', '26');
        valArc.setAttribute('fill', 'none'); valArc.setAttribute('stroke', activeGenre.theme.accent);
        valArc.setAttribute('stroke-width', '3.5'); valArc.setAttribute('stroke-linecap', 'round');
        const circ = 2 * Math.PI * 26;
        valArc.setAttribute('stroke-dasharray', `${circ}`);
        valArc.setAttribute('transform', 'rotate(135 30 30)');

        svg.appendChild(bgArc);
        svg.appendChild(valArc);

        const pointer = document.createElement('div');
        pointer.className = 'knob-pointer';

        knob.appendChild(svg);
        knob.appendChild(pointer);

        const lbl = document.createElement('div');
        lbl.className = 'knob-label';
        lbl.textContent = label;

        unit.appendChild(knob);
        unit.appendChild(lbl);

        function syncVisual() {
          const v = getVal();
          const deg = -135 + v * 270;
          pointer.style.transform = `rotate(${deg}deg)`;
          const arcLen = circ * 0.75 * v;
          valArc.setAttribute('stroke-dashoffset', `${circ - arcLen}`);
        }
        syncVisual();

        const startDrag = (clientY) => {
          sound.ensureContext();
          const startVal = getVal();
          activeKnobDrag = {
            onMove: (currY) => {
              const dy = clientY - currY;
              const next = Math.max(0, Math.min(1, startVal + dy / 110));
              setVal(next);
              syncVisual();
            }
          };
        };

        knob.addEventListener('mousedown', (e) => { e.preventDefault(); startDrag(e.clientY); });
        knob.addEventListener('touchstart', (e) => {
          if (e.touches.length > 0) { e.preventDefault(); startDrag(e.touches[0].clientY); }
        }, { passive: false });

        return unit;
      }

      function renderKnobPanel() {
        knobPanelEl.innerHTML = '';
        updateTransportUI();

        const tr = activeGenre.tracks[selectedTrack];
        const p = trackParams[selectedTrack];

        const modeBadge = document.createElement('div');
        modeBadge.className = 'mode-badge' + (tr.mode === 'sampler' ? ' sampler' : '');
        modeBadge.textContent = tr.mode.toUpperCase();
        modeBadge.title = 'クリックで SYNTH / SAMPLER を切替';
        modeBadge.addEventListener('click', () => {
          tr.mode = (tr.mode === 'synth') ? 'sampler' : 'synth';
          modeBadge.textContent = tr.mode.toUpperCase();
          modeBadge.classList.toggle('sampler', tr.mode === 'sampler');
          renderKnobPanel();
        });
        knobPanelEl.appendChild(modeBadge);

        knobPanelEl.appendChild(createKnobElement('CUTOFF', () => p.cutoff, v => p.cutoff = v));
        knobPanelEl.appendChild(createKnobElement('RESO',   () => p.reso,   v => p.reso = v));
        knobPanelEl.appendChild(createKnobElement('DRIVE',  () => p.drive,  v => p.drive = v));
        knobPanelEl.appendChild(createKnobElement('VOL',    () => p.volume, v => {
          p.volume = v;
          sound.syncTrackVolumes();
        }));
      }

      const btnPlay = document.getElementById('btn-play');
      const playIcon = document.getElementById('play-icon');
      const playText = document.getElementById('play-text');
      const btnRec = document.getElementById('btn-rec');
      const recText = document.getElementById('rec-text');
      const bpmKnob = document.getElementById('bpm-knob');
      const bpmPointer = document.getElementById('bpm-pointer');
      const bpmDisplay = document.getElementById('bpm-display');

      function updateTransportUI() {
        btnPlay.classList.toggle('playing', isPlaying);
        playIcon.innerHTML = isPlaying ? '&#9632;' : '&#9654;';
        playText.textContent = isPlaying ? 'STOP' : 'PLAY';

        btnRec.classList.remove('armed', 'recording');
        if (recState === 'armed') {
          btnRec.classList.add('armed'); recText.textContent = 'WAIT';
        } else if (recState === 'recording') {
          btnRec.classList.add('recording'); recText.textContent = 'REC 1BAR';
        } else {
          recText.textContent = 'REC';
        }
      }

      btnPlay.addEventListener('click', () => {
        if (isPlaying) stopPlayback();
        else startPlayback();
      });

      btnRec.addEventListener('click', () => {
        if (recState !== 'off') {
          recState = 'off';
          if (mediaRecorder && mediaRecorder.state === 'recording') {
            try { mediaRecorder.stop(); } catch(_) {}
          }
          updateTransportUI();
          return;
        }
        prepareMicAndArm();
      });

      function syncBpmUI() {
        bpmDisplay.textContent = bpm;
        const norm = (bpm - MIN_BPM) / (MAX_BPM - MIN_BPM);
        const deg = -135 + norm * 270;
        bpmPointer.style.transform = `rotate(${deg}deg)`;
      }

      let bpmDragging = false;
      let bpmStartY = 0;
      let bpmStartVal = bpm;

      bpmKnob.addEventListener('mousedown', (e) => {
        e.preventDefault();
        bpmDragging = true; bpmStartY = e.clientY; bpmStartVal = bpm;
      });
      window.addEventListener('mousemove', (e) => {
        if (!bpmDragging) return;
        const dy = bpmStartY - e.clientY;
        bpm = Math.round(Math.max(MIN_BPM, Math.min(MAX_BPM, bpmStartVal + dy * 0.6)));
        syncBpmUI();
      });
      window.addEventListener('mouseup', () => { bpmDragging = false; });

      bpmKnob.addEventListener('touchstart', (e) => {
        if (e.touches.length > 0) { e.preventDefault(); bpmDragging = true; bpmStartY = e.touches[0].clientY; bpmStartVal = bpm; }
      }, { passive: false });
      window.addEventListener('touchmove', (e) => {
        if (bpmDragging && e.touches.length > 0) {
          const dy = bpmStartY - e.touches[0].clientY;
          bpm = Math.round(Math.max(MIN_BPM, Math.min(MAX_BPM, bpmStartVal + dy * 0.6)));
          syncBpmUI();
        }
      }, { passive: false });
      window.addEventListener('touchend', () => { bpmDragging = false; });

      // =========================================================================
      // 6. CANVAS SEQUENCER
      // =========================================================================
      const bgCanvas = document.getElementById('bg-splash-canvas');
      const bgCtx = bgCanvas.getContext('2d');
      const mainDisc = document.getElementById('main-disc-canvas');
      const mainCtx = mainDisc.getContext('2d');

      let discGeo = { cx: 100, cy: 100, r: 95, innerR: 18, outerR: 86 };

      function paintBackgroundChassis() {
        const w = bgCanvas.parentElement.clientWidth || window.innerWidth;
        const h = bgCanvas.parentElement.clientHeight || window.innerHeight;
        bgCanvas.width = w; bgCanvas.height = h;
        bgCtx.fillStyle = activeGenre.theme.bg;
        bgCtx.fillRect(0, 0, w, h);
      }

      function resizeAllCanvases() {
        paintBackgroundChassis();
        const discPanel = document.getElementById('disc-panel');
        const pw = discPanel.clientWidth - 4;
        const ph = discPanel.clientHeight - 4;
        const size = Math.max(130, Math.floor(Math.min(pw, ph)));

        mainDisc.width = size; mainDisc.height = size;
        mainDisc.style.width = `${size}px`; mainDisc.style.height = `${size}px`;

        const cx = size / 2; const cy = size / 2; const r = size / 2 - 3;
        discGeo = { cx, cy, r, innerR: r * 0.19, outerR: r * 0.91 };

        for (const item of miniDiscItems) {
          const rect = item.pad.getBoundingClientRect();
          const mSize = Math.max(20, Math.floor(Math.min(rect.width, rect.height) - 4));
          item.canvas.width = mSize; item.canvas.height = mSize;
          item.canvas.style.width = `${mSize}px`; item.canvas.style.height = `${mSize}px`;
        }
      }

      function getTokenScreenPos(tok) {
        const { cx, cy, innerR, outerR } = discGeo;
        const radDist = innerR + tok.radius * (outerR - innerR);
        const relAngle = (tok.step / STEPS_PER_BAR) * Math.PI * 2;
        const canvasAngle = -Math.PI / 2 + relAngle;
        return { x: cx + Math.cos(canvasAngle) * radDist, y: cy + Math.sin(canvasAngle) * radDist };
      }

      function coordsToDiscPolar(x, y) {
        const { cx, cy, innerR, outerR } = discGeo;
        const dx = x - cx; const dy = y - cy;
        const dist = Math.hypot(dx, dy);
        if (dist < innerR * 0.7 || dist > outerR * 1.12) return null;

        const normRadius = Math.max(0.05, Math.min(0.98, (dist - innerR) / (outerR - innerR)));
        const canvasAngle = Math.atan2(dy, dx);
        let relAngle = canvasAngle - (-Math.PI / 2);
        let normStep = (relAngle / (Math.PI * 2)) % 1;
        if (normStep < 0) normStep += 1;
        const step = Math.round(normStep * STEPS_PER_BAR) % STEPS_PER_BAR;
        return { step, radius: normRadius };
      }

      function isSnapTrack(def) {
        if (def.snap !== undefined) return def.snap;
        return def.scale.length > 1 && def.synthType !== 'weird';
      }
      function radiusToIndex(r, len) {
        return Math.min(len - 1, Math.max(0, Math.floor((1 - r) * len)));
      }
      function snapRadius(r, len) {
        return 1 - (radiusToIndex(r, len) + 0.5) / len;
      }
      let lastPreviewAt = 0;
      function previewNote(radius, clip) {
        if (!sound.ctx) return;
        const nowMs = performance.now();
        if (nowMs - lastPreviewAt < 60) return;
        lastPreviewAt = nowMs;
        sound.triggerTrack(selectedTrack, sound.ctx.currentTime, radius, clip);
      }

      let draggedToken = null;
      let pointerDownPos = null;
      let didDragMove = false;

      function getCanvasLocalCoords(e) {
        const rect = mainDisc.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      }

      function handleDiscDown(e) {
        sound.ensureContext();
        const pos = getCanvasLocalCoords(e);
        pointerDownPos = pos; didDragMove = false;

        const clip = sessionClips[selectedTrack][selectedRow];
        const phase = trackSpinPhase[selectedTrack];

        for (let i = clip.tokens.length - 1; i >= 0; i--) {
          const tp = getTokenScreenPos(clip.tokens[i], phase);
          if (Math.hypot(pos.x - tp.x, pos.y - tp.y) <= 18) {
            draggedToken = clip.tokens[i];
            return;
          }
        }
        draggedToken = null;
      }

      function handleDiscMove(e) {
        if (!pointerDownPos) return;
        const pos = getCanvasLocalCoords(e);
        if (Math.hypot(pos.x - pointerDownPos.x, pos.y - pointerDownPos.y) > 5) didDragMove = true;
        if (draggedToken && didDragMove) {
          const polar = coordsToDiscPolar(pos.x, pos.y);
          if (polar) {
            const def = activeGenre.tracks[selectedTrack];
            if (isSnapTrack(def)) {
              const len = def.scale.length;
              const newRadius = snapRadius(polar.radius, len);
              const changed = radiusToIndex(newRadius, len) !== radiusToIndex(draggedToken.radius, len);
              draggedToken.step = polar.step;
              draggedToken.radius = newRadius;
              if (changed) previewNote(newRadius, sessionClips[selectedTrack][selectedRow]);
            } else {
              draggedToken.step = polar.step;
              draggedToken.radius = polar.radius;
            }
          }
        }
      }

      function handleDiscUp() {
        if (!pointerDownPos) return;
        const clip = sessionClips[selectedTrack][selectedRow];

        if (!didDragMove) {
          if (draggedToken) {
            const idx = clip.tokens.indexOf(draggedToken);
            if (idx >= 0) clip.tokens.splice(idx, 1);
          } else {
            const polar = coordsToDiscPolar(pointerDownPos.x, pointerDownPos.y);
            if (polar) {
              const def = activeGenre.tracks[selectedTrack];
              const snap = isSnapTrack(def);
              const len = def.scale.length;
              const radius = snap ? snapRadius(polar.radius, len) : polar.radius;
              const existingIdx = clip.tokens.findIndex(t => t.step === polar.step && (snap
                ? radiusToIndex(t.radius, len) === radiusToIndex(radius, len)
                : Math.abs(t.radius - radius) < 0.08));
              if (existingIdx >= 0) {
                clip.tokens.splice(existingIdx, 1);
              } else {
                clip.tokens.push({ step: polar.step, radius });
                if (!isPlaying) clip.active = true;
                const now = sound.ctx.currentTime;
                sound.triggerTrack(selectedTrack, now, radius, clip);
              }
            }
          }
          updateSessionPadVisuals();
        }
        pointerDownPos = null; draggedToken = null; didDragMove = false;
      }

      mainDisc.addEventListener('mousedown', (e) => { e.preventDefault(); handleDiscDown(e); });
      window.addEventListener('mousemove', handleDiscMove);
      window.addEventListener('mouseup', handleDiscUp);
      mainDisc.addEventListener('touchstart', (e) => {
        if (e.touches.length > 0) { e.preventDefault(); handleDiscDown(e); }
      }, { passive: false });
      window.addEventListener('touchmove', (e) => {
        if (pointerDownPos && e.touches.length > 0) handleDiscMove(e);
      }, { passive: false });
      window.addEventListener('touchend', handleDiscUp);

      // =========================================================================
      // 7. ANIMATION LOOP
      // =========================================================================
      function updateSpinPhases() {
        if (!isPlaying || !sound.ctx) return;
        const barSec = (60 / bpm) * 4;
        const elapsedInBar = sound.ctx.currentTime - lastScheduledBarStart;
        let phase = (elapsedInBar / barSec) % 1;
        if (phase < 0) phase += 1;

        for (let t = 0; t < 5; t++) {
          const hasActive = sessionClips[t].some(c => c.active);
          if (hasActive || (recState === 'recording' && t === selectedTrack)) {
            const div = getTrackDiv(t);
            if (div > 1) {
              const total = Math.max(0, barCounter) + elapsedInBar / barSec;
              trackSpinPhase[t] = (((total % div) + div) % div) / div;
            } else {
              trackSpinPhase[t] = phase;
            }
          }
        }
      }

      function renderMainDisc() {
        const { cx, cy, r, innerR, outerR } = discGeo;
        mainCtx.clearRect(0, 0, mainDisc.width, mainDisc.height);

        const clip = sessionClips[selectedTrack][selectedRow];
        const phase = trackSpinPhase[selectedTrack];
        const accentCol = activeGenre.theme.accent;

        mainCtx.beginPath();
        mainCtx.arc(cx, cy, r, 0, Math.PI * 2);
        mainCtx.fillStyle = '#080808';
        mainCtx.fill();
        mainCtx.lineWidth = 2.5;
        mainCtx.strokeStyle = accentCol;
        mainCtx.stroke();

        if (recState === 'recording' && sound.ctx && recDurationSec > 0) {
          const prog = Math.max(0, Math.min(1, (sound.ctx.currentTime - recStartBarTime) / recDurationSec));
          mainCtx.beginPath();
          mainCtx.arc(cx, cy, r - 2, -Math.PI / 2, -Math.PI / 2 + prog * Math.PI * 2);
          mainCtx.lineWidth = 4;
          mainCtx.strokeStyle = '#ff1155';
          mainCtx.stroke();
        }

        mainCtx.save();
        mainCtx.translate(cx, cy);

        mainCtx.beginPath();
        mainCtx.arc(0, 0, outerR, 0, Math.PI * 2);
        mainCtx.fillStyle = '#0d0d0d';
        mainCtx.fill();

        const buffer = clip.audioBuffer || (activeGenre.tracks[selectedTrack].sampleType ? sound.sampleBuffers[activeGenre.tracks[selectedTrack].sampleType] : null);
        if (buffer) {
          const chData = buffer.getChannelData(0);
          const samples = 128;
          const stepIdx = Math.floor(chData.length / samples);
          mainCtx.beginPath();
          for (let i = 0; i <= samples; i++) {
            const idx = Math.min(chData.length - 1, (i % samples) * stepIdx);
            const amp = Math.abs(chData[idx]);
            const ang = -Math.PI / 2 + (i / samples) * Math.PI * 2;
            const wr = innerR + (outerR - innerR) * (0.48 + amp * 0.38);
            const wx = Math.cos(ang) * wr;
            const wy = Math.sin(ang) * wr;
            if (i === 0) mainCtx.moveTo(wx, wy);
            else mainCtx.lineTo(wx, wy);
          }
          mainCtx.strokeStyle = accentCol;
          mainCtx.lineWidth = 1.5;
          mainCtx.stroke();
        }

        [0.25, 0.5, 0.75, 1.0].forEach(ratio => {
          mainCtx.beginPath();
          mainCtx.arc(0, 0, innerR + (outerR - innerR) * ratio, 0, Math.PI * 2);
          mainCtx.strokeStyle = '#222222';
          mainCtx.lineWidth = 1;
          mainCtx.stroke();
        });

        for (let s = 0; s < STEPS_PER_BAR; s++) {
          const ang = -Math.PI / 2 + (s / STEPS_PER_BAR) * Math.PI * 2;
          const isBeat = s % 4 === 0;
          mainCtx.beginPath();
          mainCtx.moveTo(Math.cos(ang) * innerR, Math.sin(ang) * innerR);
          mainCtx.lineTo(Math.cos(ang) * outerR, Math.sin(ang) * outerR);
          mainCtx.strokeStyle = isBeat ? '#444444' : '#1c1c1c';
          mainCtx.lineWidth = isBeat ? 1.5 : 1;
          mainCtx.stroke();
        }

        mainCtx.restore();

        mainCtx.save();
        mainCtx.translate(cx, cy);
        mainCtx.rotate(phase * Math.PI * 2);
        mainCtx.translate(-cx, -cy);
        mainCtx.beginPath();
        mainCtx.moveTo(cx, cy - innerR);
        mainCtx.lineTo(cx, cy - outerR - 2);
        mainCtx.strokeStyle = accentCol;
        mainCtx.lineWidth = 2.5;
        mainCtx.shadowColor = accentCol;
        mainCtx.shadowBlur = 8;
        mainCtx.stroke();

        mainCtx.fillStyle = accentCol;
        mainCtx.beginPath();
        mainCtx.moveTo(cx, cy - outerR + 2);
        mainCtx.lineTo(cx - 4, cy - outerR - 5);
        mainCtx.lineTo(cx + 4, cy - outerR - 5);
        mainCtx.closePath();
        mainCtx.fill();
        mainCtx.restore();

        for (const tok of clip.tokens) {
          const pos = getTokenScreenPos(tok, phase);
          let dph = Math.abs(phase - tok.step / STEPS_PER_BAR);
          dph = Math.min(dph, 1 - dph);
          const isTriggered = isPlaying && dph < 0.03;

          mainCtx.save();
          mainCtx.beginPath();
          mainCtx.arc(pos.x, pos.y, isTriggered ? 9 : 7, 0, Math.PI * 2);
          mainCtx.fillStyle = isTriggered ? '#ffffff' : accentCol;
          mainCtx.shadowColor = accentCol;
          mainCtx.shadowBlur = isTriggered ? 14 : 6;
          mainCtx.fill();

          mainCtx.lineWidth = 2;
          mainCtx.strokeStyle = '#000000';
          mainCtx.stroke();
          mainCtx.restore();
        }

        mainCtx.beginPath();
        mainCtx.arc(cx, cy, innerR, 0, Math.PI * 2);
        mainCtx.fillStyle = '#111111';
        mainCtx.fill();
        mainCtx.lineWidth = 2;
        mainCtx.strokeStyle = accentCol;
        mainCtx.stroke();

        mainCtx.beginPath();
        mainCtx.arc(cx, cy, innerR * 0.35, 0, Math.PI * 2);
        mainCtx.fillStyle = accentCol;
        mainCtx.fill();
      }

      function renderMiniDiscs() {
        for (const item of miniDiscItems) {
          const { t, r, canvas, ctx } = item;
          const w = canvas.width; const h = canvas.height;
          if (w === 0 || h === 0) continue;

          ctx.clearRect(0, 0, w, h);
          const cx = w / 2; const cy = h / 2; const rad = Math.min(cx, cy) - 2;

          const clip = sessionClips[t][r];
          const phase = clip.active ? trackSpinPhase[t] : 0;
          const accentCol = activeGenre.theme.accent;

          ctx.beginPath();
          ctx.arc(cx, cy, rad, 0, Math.PI * 2);
          ctx.fillStyle = '#101010';
          ctx.fill();
          ctx.lineWidth = clip.active ? 1.5 : 1;
          ctx.strokeStyle = clip.active ? accentCol : '#282828';
          ctx.stroke();

          for (const tok of clip.tokens) {
            const d = rad * (0.28 + tok.radius * 0.62);
            const ang = -Math.PI / 2 + (tok.step / STEPS_PER_BAR) * Math.PI * 2;
            ctx.beginPath();
            ctx.arc(cx + Math.cos(ang) * d, cy + Math.sin(ang) * d, 2, 0, Math.PI * 2);
            ctx.fillStyle = accentCol;
            ctx.fill();
          }

          if (clip.active) {
            const na = -Math.PI / 2 + phase * Math.PI * 2;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(na) * rad, cy + Math.sin(na) * rad);
            ctx.strokeStyle = accentCol;
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }

          ctx.beginPath();
          ctx.arc(cx, cy, rad * 0.22, 0, Math.PI * 2);
          ctx.fillStyle = '#000000';
          ctx.fill();
        }
      }

    let needsDiscRedraw = true;

      function animationLoop() {
        updateSpinPhases();
        renderMainDisc();
        renderMiniDiscs();
        requestAnimationFrame(animationLoop);
      }


      setGenre('techno');
      resizeAllCanvases();

      const ro = new ResizeObserver(() => { resizeAllCanvases(); });
      ro.observe(document.getElementById('app-chassis'));
      window.addEventListener('resize', resizeAllCanvases);

      requestAnimationFrame(animationLoop);
    })();
  </script>
</body>
</html>
